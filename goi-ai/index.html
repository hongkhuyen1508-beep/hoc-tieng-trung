<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f0">
<title>Gọi AI luyện nói tiếng Trung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* Một cột kiểu màn hình gọi điện, rộng tối đa 640px. */
:root {
  --paper: #f6f5f0; --surface: #ffffff; --ink: #1d1c1a; --muted: #6c6862; --line: #e5e2da;
  --seal: #cf3b2b; --seal-ink: #ffffff; --seal-soft: #f8e3df;
  --m: #2c6e63; --m-soft: #e3efec; --f: #a24470; --f-soft: #f5e5ed;
  --good: #23784a; --good-soft: #e1f1e7; --ok: #a86b12; --ok-soft: #f6ecd9; --bad: #c0362a; --bad-soft: #f8e1de; --gold: #c39331;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-zh: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151513; --surface: #1f1e1b; --ink: #f1efe9; --muted: #a39e95; --line: #34322d;
    --seal: #e5574a; --seal-ink: #1a0d0b; --seal-soft: #3a201d;
    --m: #6cc1b1; --m-soft: #1c2f2b; --f: #e08ab0; --f-soft: #36202b;
    --good: #5fcf8e; --good-soft: #193526; --ok: #e3ac4f; --ok-soft: #3a2d15; --bad: #f07a6e; --bad-soft: #3d1f1c; --gold: #e0b55a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; padding-top: env(safe-area-inset-top, 0px); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--seal) 55%, transparent); outline-offset: 2px; }
.zh { font-family: var(--font-zh); }
.muted { color: var(--muted); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: clamp(24px, 6vw, 32px); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 em { font-style: normal; color: var(--seal); }
.head { padding-block: 24px 4px; display: grid; gap: 8px; }
.section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 10px; font-weight: 600; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field { flex: 1; min-width: 0; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 11px 14px; outline: none; }
.field:focus { border-color: var(--ink); }
select.field { appearance: auto; }
.btn { border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn svg { width: 20px; height: 20px; }
.btn-primary { background: var(--seal); color: var(--seal-ink); }
.btn-dark { background: var(--ink); color: var(--paper); }
.btn-ghost { background: var(--surface); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.people { display: grid; gap: 8px; grid-template-columns: 1fr; }
@media (min-width: 520px) { .people { grid-template-columns: 1fr 1fr; } }
.person { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.person[aria-pressed="true"] { border-color: var(--seal); box-shadow: inset 0 0 0 1.5px var(--seal); }
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-zh); font-weight: 500; font-size: 19px; flex: none; }
.av.male { background: var(--m); } .av.female { background: var(--f); }
.pname { font-family: var(--font-zh); font-size: 18px; }
.note { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.callout { border-radius: 14px; padding: 12px 14px; background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent); font-size: 15px; }
.callout.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.steps { margin: 6px 0 0; padding-left: 20px; font-size: 15px; display: grid; gap: 4px; }
a { color: var(--seal); }

/* Màn hình gọi */
.call { min-height: 100svh; display: flex; flex-direction: column; }
.call-top { display: flex; align-items: center; gap: 12px; padding-block: 14px 8px; }
.call-top .who { flex: 1; min-width: 0; }
.timer { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.orb-wrap { display: grid; place-items: center; padding-block: 8px 4px; }
.orb { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-zh); font-size: 48px; color: #fff; position: relative; transition: transform .08s linear; }
.orb.male { background: var(--m); } .orb.female { background: var(--f); }
.orb::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--gold); opacity: var(--glow, 0); transform: scale(calc(1 + var(--glow, 0) * .12)); transition: opacity .1s, transform .1s; }
.state { text-align: center; font-weight: 600; margin-top: 10px; min-height: 24px; }
.state small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.meter { height: 6px; width: 140px; margin: 8px auto 0; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--good); transition: width .08s; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 12px 0 6px; }
.log { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-bottom: 200px; }
.msg { max-width: 88%; border-radius: 18px; padding: 9px 13px; }
.msg.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.me { align-self: flex-end; background: var(--seal-soft); border-bottom-right-radius: 6px; }
.msg .zh { font-size: 19px; line-height: 1.45; overflow-wrap: anywhere; }
.msg .py { font-size: 14px; color: color-mix(in srgb, var(--ink) 70%, transparent); margin-top: 2px; }
.msg .vi { font-size: 14px; color: var(--muted); margin-top: 3px; }
.msg .tools { display: flex; gap: 6px; margin-top: 6px; }
.mini { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
.msg.live { opacity: .75; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.dock .wrap { padding-top: 10px; display: grid; gap: 10px; }
.sugs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.sug { flex: 0 0 auto; max-width: 80%; text-align: left; border: 1.5px dashed color-mix(in srgb, var(--gold) 60%, transparent); background: color-mix(in srgb, var(--gold) 8%, var(--surface)); border-radius: 14px; padding: 6px 12px; display: grid; }
.sug .zh { font-size: 17px; } .sug small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.round { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; justify-self: center; }
.round svg { width: 24px; height: 24px; }
.round[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.hang { width: 68px; height: 68px; border-radius: 50%; border: 0; background: var(--bad); color: #fff; display: grid; place-items: center; }
.hang svg { width: 30px; height: 30px; transform: rotate(135deg); }
.ctl { display: grid; justify-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
.ptt { width: 100%; padding: 16px; border-radius: 18px; border: 0; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 17px; touch-action: none; user-select: none; -webkit-user-select: none; }
.ptt.on { background: var(--seal); color: var(--seal-ink); }
.typing i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 3px; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }

/* Tổng kết */
.score { display: flex; align-items: baseline; gap: 6px; }
.score b { font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
.c-good { color: var(--good); } .c-ok { color: var(--ok); } .c-bad { color: var(--bad); }
.list { display: grid; gap: 8px; }
.fix { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.good li { background: var(--good-soft); border-radius: 12px; padding: 8px 12px; list-style: none; }
.good { margin: 0; padding: 0; display: grid; gap: 6px; }
.words { display: grid; gap: 6px; }
.words div { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.words b { font-family: var(--font-zh); font-weight: 500; font-size: 19px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<script>
const SCENES = [{"t":"打招呼","v":"Chào hỏi khi gặp lại bạn","lv":"HSK1","s":"Hai người bạn tình cờ gặp nhau trên đường vào buổi sáng.","c":[{"n":"李明","v":"Lý Minh","g":"male"},{"n":"王芳","v":"Vương Phương","g":"female"}],"x":"王芳：李明，早上好！\n李明：早上好，王芳！好久不见！\n王芳：是啊，好久不见。你最近怎么样？\n李明：还不错，就是工作有点儿忙。你呢？\n王芳：我也挺好的。你去哪儿啊？\n李明：我去公司。你呢？\n王芳：我去买东西。那我们改天再聊吧！\n李明：好，再见！"},{"t":"自我介绍","v":"Giới thiệu bản thân","lv":"HSK1","s":"Ngày đầu tiên ở lớp học tiếng Trung, hai bạn học làm quen với nhau.","c":[{"n":"阿南","v":"A Nam","g":"male"},{"n":"刘静","v":"Lưu Tĩnh","g":"female"}],"x":"刘静：你好！你是新来的同学吗？\n阿南：对，我是新来的。我叫阿南。\n刘静：阿南，你好！我叫刘静。你是哪国人？\n阿南：我是越南人，从河内来。\n刘静：越南啊！我很喜欢越南菜。你学汉语多长时间了？\n阿南：我学了半年，说得还不太好。\n刘静：哪里哪里，你说得很好！\n阿南：谢谢！认识你很高兴。\n刘静：认识你我也很高兴！"},{"t":"在咖啡店","v":"Gọi đồ uống ở quán cà phê","lv":"HSK1","s":"Tiểu Vương vào quán cà phê gọi một ly latte mang đi.","c":[{"n":"小王","v":"Tiểu Vương (khách)","g":"male"},{"n":"服务员","v":"Nhân viên","g":"female"}],"x":"服务员：欢迎光临！请问您想喝点儿什么？\n小王：嗯，我要一杯拿铁。\n服务员：好的。要大杯还是中杯？\n小王：中杯就行。少放点儿糖，谢谢。\n服务员：没问题。在这儿喝还是带走？\n小王：带走。一共多少钱？\n服务员：一共二十八块。您可以扫这个二维码。\n小王：好，付好了。\n服务员：请稍等，马上就好！"},{"t":"买水果","v":"Mua hoa quả và mặc cả","lv":"HSK1","s":"Chị Trần mua xoài ở sạp hoa quả và mặc cả với ông chủ.","c":[{"n":"陈小姐","v":"Chị Trần (khách)","g":"female"},{"n":"老板","v":"Ông chủ","g":"male"}],"x":"老板：来看看吧，今天的芒果特别甜！\n陈小姐：芒果多少钱一斤？\n老板：十二块一斤。\n陈小姐：太贵了！便宜一点儿吧。\n老板：那十块一斤，怎么样？\n陈小姐：八块吧，我买三斤。\n老板：唉，好吧好吧，九块，不能再少了。\n陈小姐：行！给你二十七块。\n老板：谢谢，欢迎下次再来！"},{"t":"问路","v":"Hỏi đường","lv":"HSK1","s":"Một du khách hỏi đường đến ga tàu điện ngầm.","c":[{"n":"游客","v":"Du khách","g":"male"},{"n":"路人","v":"Người đi đường","g":"female"}],"x":"游客：不好意思，请问地铁站怎么走？\n路人：你一直往前走，到第二个路口往右拐。\n游客：第二个路口往右拐，对吗？\n路人：对。地铁站就在银行旁边。\n游客：离这儿远吗？\n路人：不远，走路五分钟就到。\n游客：太好了，谢谢您！\n路人：不客气！"},{"t":"现在几点了？","v":"Hỏi giờ và ngày tháng","lv":"HSK1","s":"Buổi sáng, cậu con trai ngủ quên và hỏi mẹ mấy giờ rồi.","c":[{"n":"儿子","v":"Con trai","g":"male"},{"n":"妈妈","v":"Mẹ","g":"female"}],"x":"儿子：妈，现在几点了？\n妈妈：七点半了，你快起床吧！\n儿子：啊？七点半了！今天几号？\n妈妈：今天十月十六号，星期五。\n儿子：糟糕，我今天八点有考试！\n妈妈：别着急，吃点儿早饭再走。\n儿子：来不及了，我走了！\n妈妈：路上小心！"},{"t":"看家人的照片","v":"Xem ảnh gia đình","lv":"HSK1","s":"Hai đồng nghiệp xem tấm ảnh gia đình trên điện thoại trong giờ nghỉ trưa.","c":[{"n":"陈大伟","v":"Trần Đại Vĩ","g":"male"},{"n":"林小雨","v":"Lâm Tiểu Vũ","g":"female"}],"x":"林小雨：大伟，这是你家人的照片吗？\n陈大伟：是啊。这是我爸爸，这是我妈妈。\n林小雨：你妈妈好漂亮啊！那这个小朋友是谁？\n陈大伟：他是我儿子，今年五岁了。\n林小雨：哇，真可爱！你家有几口人？\n陈大伟：四口人：爸爸、妈妈、儿子和我。你呢？\n林小雨：我家三口人，爸爸、妈妈和我。\n陈大伟：你爸爸妈妈也在北京吗？\n林小雨：不在。我很想他们。\n陈大伟：那今天就给他们打个电话吧！"},{"t":"今天天气怎么样？","v":"Hôm nay thời tiết thế nào?","lv":"HSK1","s":"Hai bạn cùng phòng nói chuyện về thời tiết khi định ra ngoài mua đồ.","c":[{"n":"赵阳","v":"Triệu Dương","g":"male"},{"n":"刘静","v":"Lưu Tĩnh","g":"female"}],"x":"赵阳：刘静，今天天气怎么样？\n刘静：不太好，很冷，还下雨了。\n赵阳：下雨了？我想去商店买东西呢。\n刘静：今天太冷了，明天去吧。\n赵阳：明天天气好吗？\n刘静：我看了一下，明天不下雨，也不冷。\n赵阳：太好了！那我明天上午去。\n刘静：我也想去，我们一起去吧！\n赵阳：好啊！今天我们就在家喝茶吧。\n刘静：好主意！我去做饭。"},{"t":"去医院看医生","v":"Đi bệnh viện khám bệnh","lv":"HSK1","s":"Một cô gái thấy trong người không khỏe nên đến bệnh viện gặp bác sĩ.","c":[{"n":"张医生","v":"Bác sĩ Trương","g":"male"},{"n":"王小美","v":"Vương Tiểu Mỹ","g":"female"}],"x":"张医生：你好，请坐。你怎么了？\n王小美：医生，我不舒服，头很疼。\n张医生：几天了？\n王小美：两天了。昨天我没睡好。\n张医生：你每天喝多少水？\n王小美：不多……我不太喜欢喝水。\n张医生：不行啊。你要多喝水，多睡觉。\n王小美：好的。我要吃药吗？\n张医生：要。这个药早上吃一个，晚上吃一个。明天在家睡觉吧。\n王小美：好的，谢谢医生！"},{"t":"打电话请朋友吃饭","v":"Gọi điện mời bạn đi ăn","lv":"HSK1","s":"Một chàng trai gọi điện thoại mời bạn mình đi ăn trưa ngày mai.","c":[{"n":"李华","v":"Lý Hoa","g":"male"},{"n":"周小红","v":"Chu Tiểu Hồng","g":"female"}],"x":"周小红：喂，你好！\n李华：喂，小红，我是李华。你现在在哪儿呢？\n周小红：我在家呢。怎么了？\n李华：明天中午你有时间吗？我想请你吃饭。\n周小红：真的吗？好啊！去哪儿吃？\n李华：学校前面有一个中国饭馆，菜很好吃。\n周小红：太好了！我们几点见？\n李华：十二点，怎么样？\n周小红：好，十二点在饭馆前面见。\n李华：好，不见不散！"},{"t":"买衣服","v":"Mua quần áo","lv":"HSK1","s":"Một cô gái vào cửa hàng quần áo, hỏi cỡ và mặc cả giá.","c":[{"n":"老板","v":"Ông chủ cửa hàng","g":"male"},{"n":"林小姐","v":"Chị Lâm (khách)","g":"female"}],"x":"老板：你好！想买什么？\n林小姐：我想买一件衣服。\n老板：你看看这件，很漂亮！\n林小姐：很漂亮！嗯……有点儿小。有大一点儿的吗？\n老板：有，你看这件怎么样？\n林小姐：这件好！多少钱？\n老板：三百五十块。\n林小姐：啊？太贵了 /* ---------- Gọi Gemini dạng văn bản (gợi ý, dịch, tổng kết) ---------- */
async function askText(prompt, json = true) {
  let lastErr;
  for (const m of [...new Set([store.get("textModel", TEXT_MODELS[0]), ...TEXT_MODELS])]) {
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(state.key)}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: json ? { responseMimeType: "application/json" } : {} }),
      });
      const d = await r.json();
      if (!r.ok) { lastErr = new Error(d?.error?.message || r.status); if ([404, 429, 500, 503].includes(r.status)) continue; throw lastErr; }
      store.set("textModel", m);
      const text = d.candidates?.[0]?.content?.parts?.map((p) => p.text || "").join("") || "";
      return json ? JSON.parse(text.replace(/^```(json)?|```$/g, "").trim()) : text;
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

/* ---------- Âm thanh: micro vào 16 kHz, giọng AI ra 24 kHz ---------- */
const WORKLET = `
class Mic extends AudioWorkletProcessor {
  constructor() { super(); this.buf = []; this.ratio = sampleRate / 16000; this.pos = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    let sum = 0;
    for (let i = 0; i < ch.length; i++) sum += ch[i] * ch[i];
    // Hạ mẫu đơn giản về 16 kHz.
    for (; this.pos < ch.length; this.pos += this.ratio) this.buf.push(ch[Math.floor(this.pos)]);
    this.pos -= ch.length;
    if (this.buf.length >= 1600) {
      const out = new Int16Array(this.buf.length);
      for (let i = 0; i < this.buf.length; i++) { const s = Math.max(-1, Math.min(1, this.buf[i])); out[i] = s < 0 ? s * 0x8000 : s * 0x7fff; }
      this.port.postMessage({ pcm: out.buffer, level: Math.sqrt(sum / ch.length) }, [out.buffer]);
      this.buf = [];
    }
    return true;
  }
}
registerProcessor("mic", Mic);`;

const unb64 = (s) => { const bin = atob(s); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b.buffer; };

  await call.ctx.audioWorklet.addModule(url);
  const src = call.ctx.createMediaStreamSource(call.stream);
  call.node = new AudioWorkletNode(call.ctx, "mic");
  src.connect(call.node);
  // Nối vào đầu ra với âm lượng 0 để trình duyệt vẫn chạy bộ xử lý micro.
  const mute = call.ctx.createGain(); mute.gain.value = 0; call.node.connect(mute).connect(call.ctx.destination);
  call.out = call.ctx.createGain(); call.analyser = call.ctx.createAnalyser(); call.analyser.fftSize = 256;
  call.out.connect(call.analyser); call.analyser.connect(call.ctx.destination);
  call.node.port.onmessage = (e) => onMic(e.data);
  call.start = Date.now();
  clearInterval(call.timer); call.timer = setInterval(tick, 100);
  connect();
}

function systemPrompt() {
  const p = persona(), sc = state.scene != null ? SCENES[state.scene] : null;
  const lv = state.level === "HSK1" ? "HSK1（只用最简单的词和短句）" : "HSK2（简单的日常词汇）";
  let s = `${p.style}
我是越南人，正在学中文，水平是${lv}。我们现在在打电话练习口语。
${sc ? `今天练习课文里的情景：「${sc.t}」（${sc.v}）。情景：${sc.s}\n你演「${sc.c[0].n}」或者「${sc.c[1].n}」中我没有演的那个人，课文对话如下，可以参考，但可以自由聊：\n${sc.x}` : `话题：${state.topic || p.topics[0]}`}

请遵守：
1. 只说中文（除非我要求翻译）。每次只说1到2个短句，语速慢一点，发音清楚，像真人打电话一样自然、热情、有感情，可以用"嗯、啊、哦、哈哈、真的吗"。
2. 每次说完都问我一个简单的问题，让我继续说下去。
3. 我说错的时候，先自然地回应，然后简单地说："更好的说法是……"，再请我说一遍。不要讲太长的语法。
4. 我听不懂、说"什么"或者说越南语的时候，用更简单的中文再说一遍，必要时用越南语简单解释。
5. 我说"翻译"的时候，用越南语翻译你刚才说的话。
6. 电话一开始，你先热情地打招呼，然后开始话题。`;
  return s;
}

function connect() {
  const model = LIVE_MODELS[call.modelIdx];
  call.status = "Đang gọi..."; render();
  const ws = new WebSocket(`wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(state.key)}`);
  call.ws = ws; call.ready = false;
  ws.onopen = () => {
    ws.send(JSON.stringify({ setup: {
      model: "models/" + model,
      generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: state.voice || persona().voice } } } },
      systemInstruction: { parts: [{ text: systemPrompt() }] },
      inputAudioTranscription: {}, outputAudioTranscription: {},
      realtimeInputConfig: { automaticActivityDetection: { silenceDurationMs: 900 } },
    } }));
  };
  ws.onmessage = async (ev) => {
    let msg;
    try { msg = JSON.parse(typeof ev.data === "string" ? ev.data : await ev.data.text()); } catch { return; }
    onServer(msg);
  };
  ws.onclose = (ev) => {
    if (call.ws !== ws || call.ended) return;
    if (!call.ready) {
      // Mô hình chưa mở cho khóa này: thử mô hình tiếp theo.
      if (/model|not found|not supported|unsupported/i.test(ev.reason) && call.modelIdx < LIVE_MODELS.length - 1) { call.modelIdx++; return connect(); }
      return failCall(explain(ev.reason || "Không kết nối được (mã " + ev.code + ")."));
    }
    failCall(explain(ev.reason || "Cuộc gọi bị ngắt."), true);
  };
}
function explain(reason) {
  if (/api key|API_KEY|permission|unauth/i.test(reason)) return "Khóa API chưa đúng hoặc chưa được bật Gemini API. Kiểm tra lại khóa ở mục Cài đặt. (" + reason + ")";
  if (/quota|exhaust|rate/i.test(reason)) return "Đã dùng hết lượt miễn phí trong lúc này. Đợi một lát rồi gọi lại. (" + reason + ")";
  if (/location|region|country/i.test(reason)) return "Google chưa mở Gemini API ở nơi bạn đang dùng. (" + reason + ")";
  return reason;
}

function onServer(msg) {
  if (msg.setupComplete) {
    call.ready = true; store.set("liveModel", LIVE_MODELS[call.modelIdx]);
    call.status = "";
    // Để AI chào trước như một cuộc gọi thật.
    call.ws.send(JSON.stringify({ clientContent: { turns: [{ role: "user", parts: [{ text: "（电话接通了，请你先打招呼。）" }] }], turnComplete: true } }));
    render(); return;
  }
  if (msg.goAway) { call.status = "Cuộc gọi sắp hết thời gian, hãy chào tạm biệt."; renderState(); }
  const sc = msg.serverContent;
  if (!sc) return;
  if (sc.interrupted) { stopPlayback(); finish("ai"); }
  if (sc.inputTranscription?.text) addText("me", sc.inputTranscription.text);
  if (sc.outputTranscription?.text) { finish("me"); addText("ai", sc.outputTranscription.text); }
  for (const part of sc.modelTurn?.parts || []) {
    if (part.inlineData?.data && /audio/.test(part.inlineData.mimeType || "audio")) { finish("me"); play(part.inlineData.data, part.inlineData.mimeType); }
  }
  if (sc.turnComplete) { finish("me"); finish("ai"); }
}

function play(data, mime) {
  const rate = +((mime || "").match(/rate=(\d+)/)?.[1] || 24000);
  const pcm = new Int16Array(unb64(data));
  const buf = call.ctx.createBuffer(1, pcm.length, rate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  const s = call.ctx.createBufferSource();
  s.buffer = buf; s.connect(call.out);
  const t = Math.max(call.ctx.currentTime + 0.03, call.nextTime);
  s.start(t); call.nextTime = t + buf.duration;
  call.sources.push(s);
  s.onended = () => { call.sources = call.sources.filter((x) => x !== s); };
}
function stopPlayback() { for (const s of call.sources) { try { s.stop(); } catch {} } call.sources = []; call.nextTime = 0; }
const aiSpeaking = () => call.sources.length > 0;

function onMic({ pcm, level }) {
  const live = call.ready && !call.muted && (state.mode === "free" || call.talking);
  const m = $("#mic-meter"); if (m) m.style.width = live ? Math.min(100, level * 600) + "%" : "0%";
  if (!live || call.ws?.readyState !== 1) return;
  call.ws.send(JSON.stringify({ realtimeInput: { audio: { mimeType: "audio/pcm;rate=16000", data: b64(pcm) } } }));
}
function pttDown() { if (!call.ready) return; call.talking = true; stopPlayback(); $("#ptt")?.classList.add("on"); }
function pttUp() {
  if (!call.talking) return;
  call.talking = false; $("#ptt")?.classList.remove("on");
  if (call.ws?.readyState === 1) call.ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
}

function tick() {
  const t = $("#timer"); if (t) { const s = Math.floor((Date.now() - call.start) / 1000); t.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
  const orb = $("#orb");
  if (orb && call.analyser) {
    const d = new Uint8Array(call.analyser.frequencyBinCount); call.analyser.getByteTimeDomainData(d);
    let sum = 0; for (const v of d) sum += ((v - 128) / 128) ** 2;
    const lv = Math.min(1, Math.sqrt(sum / d.length) * 5);
    orb.style.setProperty("--glow", lv.toFixed(2)); orb.style.transform = `scale(${1 + lv * 0.06})`;
  }
  renderState();
}
function renderState() {
  const el = $("#state"); if (!el) return;
  const txt = call.status || (aiSpeaking() ? `${persona().name} đang nói...<small>Bạn có thể nói chen vào bất cứ lúc nào</small>` : call.muted ? "Micro đang tắt<small>Bấm nút micro để nói tiếp</small>" : state.mode === "ptt" ? (call.talking ? "Đang nghe bạn nói..." : "Bấm giữ nút bên dưới để nói") : "Đang nghe, bạn cứ nói<small>Nói xong, dừng một chút để AI trả lời</small>");
  if (el.dataset.t !== txt) { el.innerHTML = txt; el.dataset.t = txt; }
}

function addText(who, text) {
  let m = call.cur[who];
  if (!m) { m = { who, text: "", live: true }; call.cur[who] = m; call.log.push(m); }
  m.text += text;
  renderLog();
}
function finish(who) {
  const m = call.cur[who]; if (!m) return;
  m.live = false; m.text = m.text.trim(); call.cur[who] = null;
  if (who === "ai") call.sugs = [];
  renderLog();
}
function renderLog() {
  const el = $("#log"); if (!el) return;
  const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
  el.innerHTML = call.log.filter((m) => m.text.trim()).map((m, i) => {
    const show = state.showText || m.peek || m.who === "me";
    const body = show ? `<div class="zh">${esc(m.text)}</div>${state.showPy && /[一-鿿]/.test(m.text) ? `<div class="py">${esc(py(m.text))}</div>` : ""}${m.vi ? `<div class="vi">${esc(m.vi)}</div>` : ""}` : `<button class="mini" data-peek="${call.log.indexOf(m)}">Chạm để xem chữ</button>`;
    const tools = m.who === "ai" && !m.live ? `<div class="tools">${show && !m.vi ? `<button class="mini" data-tr="${call.log.indexOf(m)}">Dịch</button>` : ""}</div>` : "";
    return `<div class="msg ${m.who} ${m.live ? "live" : ""}">${body}${tools}</div>`;
  }).join("") || `<p class="muted" style="text-align:center">Lời thoại sẽ hiện ở đây.</p>`;
  if (atBottom) window.scrollTo(0, document.body.scrollHeight);
  const s = $("#sugs");
  if (s) s.innerHTML = call.sugBusy ? `<span class="muted typing"><i></i><i></i><i></i> Đang nghĩ gợi ý...</span>` : call.sugs.map((x) => `<div class="sug"><span class="zh">${esc(x.zh)}</span><small>${esc(x.pinyin || "")}</small><small>${esc(x.vi || "")}</small></div>`).join("");
}
const transcript = () => call.log.filter((m) => m.text).map((m) => (m.who === "ai" ? persona().name : "Người học") + ": " + m.text).join("\n");

async function suggest() {
  if (call.sugBusy) return;
  call.sugBusy = true; renderLog();
  try {
    const d = await askText(`Đây là cuộc gọi luyện nói tiếng Trung (trình độ ${state.level}) giữa người học Việt Nam và ${persona().name}:
${transcript() || "(chưa có lời thoại)"}

Hãy đưa ra 3 câu tiếng Trung ngắn, tự nhiên, mức ${state.level}, mà người học có thể nói tiếp ngay bây giờ. Chỉ trả về JSON: {"suggestions":[{"zh":"","pinyin":"pinyin có dấu","vi":"nghĩa tiếng Việt"}]}`);
    call.sugs = (d.suggestions || []).slice(0, 3);
  } catch (e) { call.sugs = [{ zh: "", vi: "Chưa lấy được gợi ý: " + e.message }]; }
  call.sugBusy = false; renderLog();
}
async function translate(i) {
  const m = call.log[i]; if (!m) return;
  m.vi = "Đang dịch..."; renderLog();
  try { m.vi = (await askText(`Dịch câu tiếng Trung sau sang tiếng Việt tự nhiên, chỉ trả về bản dịch: ${m.text}`, false)).trim(); }
  catch (e) { m.vi = "Chưa dịch được: " + e.message; }
  renderLog();
}

function teardown() {
  clearInterval(call.timer);
  try { call.ws && call.ws.close(); } catch {}
  call.ws = null;
  stopPlayback();
  try { call.stream?.getTracks().forEach((t) => t.stop()); } catch {}
  try { call.ctx?.close(); } catch {}
  call.ctx = null;
}
function failCall(text, dropped = false) {
  teardown(); call.ended = true;
  call.error = text; state.view = call.log.some((m) => m.who === "me" && m.text) ? "summary" : "setup";
  if (state.view === "summary") summarize(); else render();
}
function hangUp() {
  call.ended = true; teardown();
  finish("me"); finish("ai");
  if (call.log.some((m) => m.who === "me" && m.text)) { state.view = "summary"; summarize(); } else { state.view = "setup"; render(); }
}
async function summarize() {
  call.summary = null; call.sumBusy = true; render();
  try {
    call.summary = await askText(`Bạn là giáo viên tiếng Trung. Đây là cuộc gọi luyện nói của người Việt (trình độ ${state.level}) với ${persona().name}. Lời của người học được máy nhận dạng từ giọng nói nên có thể có lỗi nhận dạng; chỉ góp ý những lỗi chắc chắn.
${transcript()}

Đánh giá ngắn gọn, thân thiện, bằng tiếng Việt. Chỉ trả về JSON:
{"score": số 0-100 cho khả năng giao tiếp, "overall_vi": "1-2 câu nhận xét, khích lệ", "good_vi": ["tối đa 3 điểm tốt"], "fixes": [{"wrong": "câu người học nói", "right": "câu đúng", "right_pinyin": "pinyin có dấu", "why_vi": "giải thích ngắn"}], "words": [{"zh": "", "pinyin": "", "vi": ""}]}
fixes tối đa 4. words: 4-8 từ hữu ích trong cuộc gọi.`);
  } catch (e) { call.sumError = e.message; }
  call.sumBusy = false; render();
}

  const app = $("#app");

function summaryView() {
  const back = `<div style="display:flex;gap:8px;margin:20px 0 32px"><button class="btn btn-primary" data-start>${ICON.phone}Gọi lại</button><button class="btn btn-ghost" data-setup>Xong</button></div>`;

  else {
    const s = call.summary, score = Math.max(0, Math.min(100, Math.round(+s.score || 0))), tone = score >= 85 ? "good" : score >= 60 ? "ok" : "bad";
    body = `<div class="box" style="margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center"><div class="score"><b class="c-${tone}">${score}</b><span class="muted">/100</span></div><p style="margin:0">${esc(s.overall_vi)}</p></div>
      ${(s.good_vi || []).length ? `<div class="section-title">Bạn làm tốt</div><ul class="good">${s.good_vi.map((g) => `<li>✓ ${esc(g)}</li>`).join("")}</ul>` : ""}
      ${(s.fixes || []).length ? `<div class="section-title">Nên sửa</div><div class="list">${s.fixes.map((f) => `<div class="fix"><div class="zh c-bad" style="text-decoration:line-through">${esc(f.wrong)}</div><div class="zh c-good" style="font-size:19px">${esc(f.right)}</div><div class="muted">${esc(f.right_pinyin)}</div><div style="font-size:14px;margin-top:4px">${esc(f.why_vi)}</div></div>`).join("")}</div>` : ""}
      ${(s.words || []).length ? `<div class="section-title">Từ nên nhớ</div><div class="box words">${s.words.map((w) => `<div><b>${esc(w.zh)}</b><span>${esc(w.pinyin)}</span><span class="muted">${esc(w.vi)}</span></div>`).join("")}</div>` : ""}`;
  }
  const log = call.log.filter((m) => m.text).map((m) => `<div class="msg ${m.who}"><div class="zh">${esc(m.text)}</div></div>`).join("");
  return `<div class="wrap"><section class="head"><h1>Tổng kết cuộc gọi</h1>${call.error ? `<p class="muted" style="margin:0">${esc(call.error)}</p>` : ""}</section>${body}
    ${log ? `<div class="section-title">Lời thoại</div><div class="log" style="padding-bottom:0">${log}</div>` : ""}${back}</div>`;
}

/* ---------- Sự kiện ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.pid) { state.pid = d.pid; state.scene = null; state.topic = ""; store.set("pid", d.pid); return render(); }
  if (d.topic) { state.topic = d.topic; state.scene = null; return render(); }
  if (d.level) { state.level = d.level; store.set("level", d.level); return render(); }
  if (d.mode) { state.mode = d.mode; store.set("mode", d.mode); return render(); }
  if ("start" in d) {
    const typed = $("#topic-in")?.value.trim(); if (typed) { state.topic = typed; state.scene = null; }
    call.error = ""; return startCall();
  }
  if ("changekey" in d) { state.view = "key"; return render(); }
  if ("setup" in d) { call.error = ""; state.view = "setup"; return render(); }
  if ("hang" in d) return hangUp();
  if ("mute" in d) { call.muted = !call.muted; t.setAttribute("aria-pressed", call.muted); t.innerHTML = call.muted ? ICON.micOff : ICON.mic; t.nextSibling.textContent = call.muted ? "Bật micro" : "Tắt micro"; return renderState(); }
  if ("sug" in d) return suggest();
  if (d.tog) { state[d.tog] = !state[d.tog]; store.set(d.tog, state[d.tog]); t.setAttribute("aria-pressed", state[d.tog]); return renderLog(); }
  if (d.peek != null) { call.log[+d.peek].peek = true; return renderLog(); }
  if (d.tr != null) return translate(+d.tr);
});
document.addEventListener("change", (e) => {
  if (e.target.id === "scene-in") { state.scene = e.target.value === "" ? null : +e.target.value; if (state.scene != null) state.level = SCENES[state.scene].lv; render(); }
  if (e.target.id === "voice-in") { state.voice = e.target.value; store.set("voice", state.voice); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "key-form") {
    const k = $("#key-in").value.trim(); if (!k) return;
    state.key = k; store.set("key", k); state.view = "setup"; render();
  }
});
// Bấm giữ để nói: dùng pointer để chạy được cả trên điện thoại và máy tính.
document.addEventListener("pointerdown", (e) => { if (e.target.id === "ptt") { e.preventDefault(); e.target.setPointerCapture?.(e.pointerId); pttDown(); } });
document.addEventListener("pointerup", (e) => { if (e.target.id === "ptt") pttUp(); });
document.addEventListener("pointercancel", () => pttUp());
document.addEventListener("visibilitychange", () => { if (document.hidden && state.view === "call" && call.ctx) call.ctx.suspend(); else if (!document.hidden && call.ctx) call.ctx.resume(); });
render();
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#4f63d2">
<title>Little Thinkers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap&subset=vietnamese">
<style>
/* Mỗi câu đố là một tấm thẻ lớn ở giữa, đáp án là các nút to bên dưới cho ngón tay bé */
:root {
  --ground: #eef0fb;
  --surface: #ffffff;
  --card: #f6f7fe;
  --ink: #22284a;
  --soft-ink: #5c6385;
  --frame: #4f63d2;
  --line: #d9ddf5;
  --sun: #ffb703;
  --sun-soft: #fff1c7;
  --berry: #e63e6d;
  --berry-soft: #ffe0e8;
  --leaf: #2a9d8f;
  --leaf-soft: #d9f2ee;
  --shadow: 0 4px 0 rgba(34, 40, 74, .12);
  --font-display: "Baloo 2", "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #151a2e; --surface: #20263f; --card: #1a2036; --ink: #eceffc; --soft-ink: #a9b0d0;
    --frame: #7d8cf0; --line: #333b5e; --sun: #ffc53d; --sun-soft: #4a3d17; --berry: #ff6b8e;
    --berry-soft: #4a2230; --leaf: #4cc9b0; --leaf-soft: #173a36; --shadow: 0 4px 0 rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #151a2e; --surface: #20263f; --card: #1a2036; --ink: #eceffc; --soft-ink: #a9b0d0;
  --frame: #7d8cf0; --line: #333b5e; --sun: #ffc53d; --sun-soft: #4a3d17; --berry: #ff6b8e;
  --berry-soft: #4a2230; --leaf: #4cc9b0; --leaf-soft: #173a36; --shadow: 0 4px 0 rgba(0, 0, 0, .35); color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-body);
  font-size: 17px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap {
  max-width: 640px; margin: 0 auto; min-height: 100%; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px; display: flex; flex-direction: column; gap: 14px;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.1; }
.btn {
  border: 0; border-radius: 18px; padding: 14px 22px; background: var(--surface); box-shadow: var(--shadow);
  font-family: var(--font-display); font-size: 1.15rem; font-weight: 800; display: inline-flex;
  align-items: center; justify-content: center; gap: 8px; min-height: 56px; transition: transform .1s;
}
.btn:active { transform: translateY(3px); box-shadow: none; }
.btn.big { background: var(--sun); color: #3a2a00; font-size: 1.5rem; min-height: 70px; border-radius: 22px; }
.icon-btn { width: 52px; height: 52px; min-height: 52px; padding: 0; border-radius: 16px; font-size: 1.5rem; }
.label { font-family: var(--font-display); font-weight: 800; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--soft-ink); }

/* Trang chủ */
.hero { display: grid; gap: 4px; text-align: center; padding-top: 14px; }
.hero .mascot { font-size: 3.4rem; line-height: 1; }
.hero h1 { font-size: clamp(2.5rem, 11vw, 3.4rem); font-weight: 800; color: var(--frame); }
.hero p { margin: 0; color: var(--soft-ink); font-size: 1.05rem; }
.ages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.age {
  border: 3px solid transparent; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow);
  padding: 8px 2px; display: grid; justify-items: center; gap: 0; font-weight: 800; font-size: .9rem;
}
.age b { font-size: 1.6rem; line-height: 1.25; }
.age[aria-pressed="true"] { border-color: var(--sun); background: var(--sun-soft); }
.langs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.lang { border: 3px solid transparent; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); padding: 10px 4px; display: flex; justify-content: center; align-items: center; gap: 8px; font-weight: 800; }
.lang b { font-size: 1.5rem; line-height: 1.2; }
.lang[aria-pressed="true"] { border-color: var(--sun); background: var(--sun-soft); }
.games { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.game {
  border: 0; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); padding: 14px 10px 12px;
  display: grid; justify-items: center; gap: 4px; text-align: center; transition: transform .1s;
}
.game:active { transform: translateY(3px); box-shadow: none; }
.game .ic { font-size: 2.4rem; line-height: 1.15; }
.game h3 { font-size: 1.2rem; }
.game small { color: var(--soft-ink); font-size: .88rem; line-height: 1.25; }
.game .st { font-size: .95rem; letter-spacing: 1px; min-height: 1.2em; }
.game .st .off { filter: grayscale(1); opacity: .3; }
.parents { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 4px 14px; }
.parents summary { font-family: var(--font-display); font-weight: 800; padding: 10px 0; cursor: pointer; color: var(--soft-ink); }
.parents .body { display: grid; gap: 12px; padding-bottom: 14px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; }
.toggle input { width: 26px; height: 26px; accent-color: var(--frame); }
.note { margin: 0; color: var(--soft-ink); font-size: .92rem; line-height: 1.4; }
.keyrow { display: flex; gap: 8px; flex-wrap: wrap; }
.field {
  flex: 1; min-width: 180px; border: 2px solid var(--line); border-radius: 14px; padding: 12px; font: inherit;
  background: var(--card); color: var(--ink); user-select: text; -webkit-user-select: text;
}

/* Màn chơi */
.topbar { display: flex; align-items: center; gap: 10px; }
.dots { flex: 1; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.dots i.done { background: var(--leaf); }
.dots i.now { background: var(--sun); transform: scale(1.25); }
.ask {
  display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 20px;
  box-shadow: var(--shadow); padding: 10px 12px;
}
.ask .face { font-size: 2.2rem; line-height: 1; }
.ask p { margin: 0; flex: 1; font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.2; }
.ask.good { background: var(--leaf-soft); }
.ask.oops { background: var(--berry-soft); }
.board {
  background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 14px;
  min-height: 150px; display: grid; place-items: center; gap: 10px; box-sizing: border-box;
}
.pile { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 4px 6px; line-height: 1.15; }
.pile span { display: inline-block; }
.pile.tap span { cursor: pointer; border-radius: 12px; padding: 0 2px; }
.pile.tap span.ticked { background: var(--sun-soft); outline: 2px solid var(--sun); }
.seq { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.seq b {
  min-width: 52px; height: 58px; padding: 0 4px; box-sizing: border-box; border-radius: 14px; background: var(--card);
  border: 2px solid var(--line); display: grid; place-items: center; font-size: 1.9rem; font-family: var(--font-display); font-weight: 800;
}
.seq b.q { background: var(--sun-soft); border: 3px dashed var(--sun); color: var(--soft-ink); }
.sum { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; }
.sum .grp { display: flex; flex-wrap: wrap; justify-content: center; max-width: 9.5em; gap: 2px; font-size: 1.9rem; background: var(--card); border-radius: 14px; padding: 6px; }
.sum .grp .gone { position: relative; opacity: .35; }
.sum .grp .gone::after { content: "✖"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--berry); font-size: .9em; opacity: 1; }
.sum .op { font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; color: var(--frame); }
.sum .num { font-family: var(--font-display); font-weight: 800; font-size: 3rem; }
.sum .q { font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; background: var(--sun-soft); border: 3px dashed var(--sun); border-radius: 14px; padding: 0 16px; color: var(--soft-ink); }
.big-one { font-size: 5rem; line-height: 1; }
.opts { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 12px; }
.opt {
  border: 3px solid transparent; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow);
  min-height: 86px; padding: 8px; display: grid; place-items: center; font-family: var(--font-display);
  font-weight: 800; font-size: 3rem; line-height: 1.1; transition: transform .1s;
}
.opt:active { transform: translateY(3px); box-shadow: none; }
.opt.wrong { background: var(--berry-soft); border-color: var(--berry); animation: shake .35s; opacity: .6; }
.opt.right { background: var(--leaf-soft); border-color: var(--leaf); animation: pop .4s; }
.opt.hint { border-color: var(--sun); animation: glow 1s infinite alternate; }
.opt.panel { font-size: 1.6rem; min-height: 130px; align-content: center; }
.opt.panel .pile { gap: 2px; }
.opt .shadow { filter: brightness(0); opacity: .78; }
:root[data-theme="dark"] .opt .shadow { filter: brightness(0) invert(1); opacity: .85; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .opt .shadow { filter: brightness(0) invert(1); opacity: .85; } }
.opt.word { font-size: 1.35rem; min-height: 64px; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
@keyframes pop { 50% { transform: scale(1.08); } }
@keyframes glow { to { box-shadow: 0 0 0 6px var(--sun-soft), var(--shadow); } }

.clock { width: min(210px, 58vw); height: auto; }
.clock .face { fill: var(--card); stroke: var(--frame); stroke-width: 3; }
.clock text { font-family: var(--font-display); font-weight: 800; font-size: 11px; fill: var(--ink); text-anchor: middle; }
.clock line { stroke-linecap: round; }
.clock .hh { stroke: var(--ink); }
.clock .mh { stroke: var(--berry); }
.clock .pin { fill: var(--ink); }
.shape { width: 72px; height: 72px; }
.seq .op { align-self: center; color: var(--frame); font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; }
.eqs { display: grid; gap: 8px; justify-items: center; }
.eq { display: flex; align-items: center; gap: 8px; font-size: 2.2rem; }
.eq b { font-family: var(--font-display); color: var(--frame); font-size: 2rem; }
.eq .num { font-family: var(--font-display); font-weight: 800; }
.eq .q { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; background: var(--sun-soft); border: 3px dashed var(--sun); border-radius: 12px; padding: 0 12px; color: var(--soft-ink); }
.grid { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 8px; }
.grid span { width: 68px; height: 68px; display: grid; place-items: center; font-size: 2.5rem; background: var(--card); border: 2px solid var(--line); border-radius: 16px; }
.grid span.ref { border: 3px solid var(--sun); background: var(--sun-soft); }

/* Chúc mừng */
.overlay { position: fixed; inset: 0; background: rgba(20, 24, 48, .55); display: grid; place-items: center; z-index: 20; padding: 16px; }
.winbox {
  background: var(--surface); border-radius: 28px; padding: 22px 18px; width: min(420px, 100%); box-sizing: border-box;
  display: grid; gap: 12px; text-align: center; animation: pop .5s;
}
.winbox h2 { font-size: 2.2rem; color: var(--frame); }
.winstars { font-size: 3rem; letter-spacing: 4px; }
.winstars .off { filter: grayscale(1); opacity: .3; }
.winbox .acts { display: grid; gap: 10px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti span { position: absolute; top: -50px; font-size: 2rem; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce) { .opt.wrong, .opt.right, .opt.hint, .winbox { animation: none; } }
@media (min-width: 560px) { .games { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<!-- Trang chủ -->
<div class="wrap" id="home">
  <div class="hero">
    <div class="mascot" aria-hidden="true">🦉</div>
    <h1 data-t="title"></h1>
    <p data-t="tagline"></p>
  </div>
  <div class="langs" id="langs"></div>
  <div class="label" data-t="ageQ"></div>
  <div class="ages" id="ages"></div>
  <div class="label" data-t="pickGame"></div>
  <div class="games" id="games"></div>
  <details class="parents">
    <summary data-t="parents"></summary>
    <div class="body">
      <label class="toggle"><span data-t="optSound"></span> <input type="checkbox" id="optSound"></label>
      <label class="toggle"><span data-t="optVoice"></span> <input type="checkbox" id="optVoice"></label>
      <label class="toggle"><span data-t="optAi"></span> <input type="checkbox" id="optAi"></label>
      <p class="note" data-t="aiNote"></p>
      <div class="keyrow"><input id="aiKeyInput" class="field" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" data-tp="keyPh"><button class="btn" id="aiKeySave" data-t="saveKey"></button></div>
      <p class="note" id="aiStatus"></p>
      <p class="note" data-t="howNote"></p>
      <button class="btn" id="resetBtn" data-t="reset"></button>
    </div>
  </details>
</div>

<!-- Màn chơi -->
<div class="wrap" id="play" hidden>
  <div class="topbar">
    <button class="btn icon-btn" id="backBtn" data-ta="home">🏠</button>
    <div class="dots" id="dots"></div>
    <button class="btn icon-btn" id="sayBtn" data-ta="replay">🔊</button>
  </div>
  <div class="ask" id="ask"><span class="face" id="face">🦉</span><p id="askText"></p></div>
  <div class="board" id="board"></div>
  <div class="opts" id="opts"></div>
</div>

<div class="overlay" id="winBox" hidden>
  <div class="winbox">
    <h2 id="winTitle"></h2>
    <div class="winstars" id="winStars"></div>
    <p class="note" id="winNote"></p>
    <div class="acts">
      <button class="btn big" id="againBtn" data-t="again"></button>
      <button class="btn" id="homeBtn" data-t="other"></button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // ---------- Hình và tên gọi (tiếng Việt và tiếng Anh) ----------
  // Mỗi nhóm có tên để giải thích khi bé tìm hình khác nhóm: one/many là tên tiếng Anh số ít/số nhiều
  const CATS = {
    thu:  { vi: 'con thú', one: 'a land animal', many: 'land animals', fam: 'vat', items: [['🐶', 'con chó', 'dog'], ['🐱', 'con mèo', 'cat'], ['🐰', 'con thỏ', 'rabbit'], ['🐻', 'con gấu', 'bear'], ['🐼', 'gấu trúc', 'panda'], ['🦁', 'sư tử', 'lion'], ['🐯', 'con hổ', 'tiger'], ['🐮', 'con bò', 'cow'], ['🐷', 'con lợn', 'pig'], ['🐘', 'con voi', 'elephant'], ['🦒', 'hươu cao cổ', 'giraffe'], ['🐒', 'con khỉ', 'monkey'], ['🐴', 'con ngựa', 'horse']] },
    chim: { vi: 'loài chim', one: 'a bird', many: 'birds', fam: 'vat', items: [['🐔', 'con gà', 'chicken'], ['🦆', 'con vịt', 'duck'], ['🦉', 'con cú', 'owl'], ['🦜', 'con vẹt', 'parrot'], ['🐤', 'gà con', 'chick'], ['🦢', 'thiên nga', 'swan'], ['🦩', 'hồng hạc', 'flamingo']] },
    bien: { vi: 'con vật dưới nước', one: 'a water animal', many: 'water animals', fam: 'vat', items: [['🐠', 'con cá', 'fish'], ['🐙', 'bạch tuộc', 'octopus'], ['🦀', 'con cua', 'crab'], ['🐬', 'cá heo', 'dolphin'], ['🐳', 'cá voi', 'whale'], ['🦈', 'cá mập', 'shark'], ['🦐', 'con tôm', 'shrimp']] },
    qua:  { vi: 'trái cây', one: 'a fruit', many: 'fruits', fam: 'an', items: [['🍎', 'quả táo', 'apple'], ['🍌', 'quả chuối', 'banana'], ['🍇', 'chùm nho', 'bunch of grapes'], ['🍓', 'quả dâu', 'strawberry'], ['🍊', 'quả cam', 'orange'], ['🍉', 'dưa hấu', 'watermelon'], ['🍍', 'quả dứa', 'pineapple'], ['🍒', 'quả anh đào', 'cherry'], ['🍐', 'quả lê', 'pear'], ['🥭', 'quả xoài', 'mango']] },
    rau:  { vi: 'rau củ', one: 'a vegetable', many: 'vegetables', fam: 'an', items: [['🥕', 'cà rốt', 'carrot'], ['🥦', 'súp lơ xanh', 'broccoli'], ['🌽', 'bắp ngô', 'corn'], ['🍆', 'cà tím', 'eggplant'], ['🥒', 'dưa chuột', 'cucumber'], ['🧅', 'củ hành', 'onion'], ['🥔', 'khoai tây', 'potato']] },
    xe:   { vi: 'xe cộ', one: 'a vehicle', many: 'vehicles', fam: 'xe', items: [['🚗', 'ô tô', 'car'], ['🚌', 'xe buýt', 'bus'], ['🚓', 'xe cảnh sát', 'police car'], ['🚑', 'xe cứu thương', 'ambulance'], ['🚒', 'xe cứu hỏa', 'fire truck'], ['🚜', 'máy cày', 'tractor'], ['🚲', 'xe đạp', 'bicycle'], ['✈️', 'máy bay', 'airplane'], ['🚀', 'tên lửa', 'rocket'], ['🚂', 'tàu hỏa', 'train'], ['🛵', 'xe máy', 'scooter']] },
  };
  const ALL = Object.entries(CATS).flatMap(([c, v]) => v.items.map(([e, n, en]) => ({ e, n, en, c })));
  // Hình dễ đếm (rõ, không quá giống nhau)
  const COUNTABLE = ['🍎', '🐶', '🐱', '🍌', '⭐', '🎈', '🌸', '🐟', '🦆', '🍓', '🚗', '🐰', '🍊', '🐤', '⚽'];
  const NAME = Object.assign({ '⭐': 'ngôi sao', '🎈': 'quả bóng bay', '🌸': 'bông hoa', '🐟': 'con cá', '⚽': 'quả bóng' }, Object.fromEntries(ALL.map(x => [x.e, x.n])));
  // Tên tiếng Anh của hình dùng để đếm: [số ít, số nhiều]
  const COUNT_EN = { '🍎': ['apple', 'apples'], '🐶': ['dog', 'dogs'], '🐱': ['cat', 'cats'], '🍌': ['banana', 'bananas'], '⭐': ['star', 'stars'], '🎈': ['balloon', 'balloons'], '🌸': ['flower', 'flowers'], '🐟': ['fish', 'fish'], '🦆': ['duck', 'ducks'], '🍓': ['strawberry', 'strawberries'], '🚗': ['car', 'cars'], '🐰': ['rabbit', 'rabbits'], '🍊': ['orange', 'oranges'], '🐤': ['chick', 'chicks'], '⚽': ['ball', 'balls'] };
  const many = (e, n) => COUNT_EN[e][n === 1 ? 0 : 1];

  const AGES = ['🐣', '🐥', '🦊', '🦁'];
  const ROUND = 8;

  // ---------- Chữ trên trang theo ngôn ngữ (mặc định tiếng Anh) ----------
  const LANGS = [['en', '🇬🇧', 'English'], ['vi', '🇻🇳', 'Tiếng Việt']];
  const TX = {
    en: {
      title: 'Little Thinkers', tagline: 'Count, compare, find patterns, guess shadows. Fun, and no losing!',
      ageQ: 'How old is your child?', pickGame: 'Choose a game', age: i => ['3–4', '4–5', '5–6', '6–7'][i] + ' yrs', ageSay: i => 'Age ' + ['3 to 4', '4 to 5', '5 to 6', '6 to 7'][i],
      parents: '👪 For parents', optSound: 'Fun sounds', optVoice: 'Read questions aloud', optAi: 'Lifelike AI voice',
      aiNote: 'The AI voice uses Google Gemini and sounds like a real teacher. It needs a free Gemini key (get one at aistudio.google.com/apikey). If you already saved a key in the Chinese learning site or Sudoku Bé Vui, this page shares it. Each sentence is made once and then kept on this device.',
      keyPh: 'Paste your Gemini key (AIza...)', saveKey: 'Save key',
      howNote: 'Each round has 8 questions. A wrong answer can be tried again, and after 2 tries the right answer glows. Fewer mistakes earn 3 stars. Difficulty follows the age chosen above.',
      reset: 'Clear earned stars', resetQ: 'Clear all the stars your child has earned?', home: 'Back to home', replay: 'Hear the question again',
      again: '▶ Play again', other: '🏠 Pick another game', stars: n => n + ' stars', hello: "Hello! Let's play together!",
      praise: ['Great job!', "That's right!", 'Awesome!', 'So clever!', 'Correct!', 'Hooray!'],

          lines = [eq([A, '+', A], 2 * v), eq([A, '+', B], v + w), eq([B], '?')];
          ask = vien('Mỗi ' + NAME[B] + ' là số mấy?', 'What number is each ' + one(B, 1) + '?');
          praise = vien('Đúng rồi! ' + cap(NAME[A]) + ' là ' + v + ', nên ' + NAME[B] + ' là ' + w + '.', 'That’s right! The ' + one(A, 1) + ' is ' + v + ', so the ' + one(B, 1) + ' is ' + w + '.');
        }
        return { ask, board: '<div class="eqs">' + lines.join('') + '</div>', opts: numOpts(ans, d === 0 ? 3 : 4, 1).map(v => ({ v, html: v })), ans, praise };
      },
    },
    {
      id: 'vitri', icon: '🧭', name: ['Ở đâu nhỉ?', 'Where is it?'], desc: ['Trên, dưới, trái, phải', 'Above, below, left, right'],
      make(d) {
        const n = d === 0 ? 2 : 3;
        const items = sample(ALL, n * n), at = (r, c) => items[r * n + c];
        const rels = [['above', 'below'], ['above', 'below'], ['above', 'below', 'left', 'right'], ['above', 'below', 'left', 'right', 'between']][d];
        const rel = pick(rels);
        let refs, ans;
        if (rel === 'between') {
          const k = ri(0, 2);
          if (R() < .5) { refs = [at(k, 0), at(k, 2)]; ans = at(k, 1); } else { refs = [at(0, k), at(2, k)]; ans = at(1, k); }
        } else {
          const [dr, dc] = { above: [-1, 0], below: [1, 0], left: [0, -1], right: [0, 1] }[rel];
          let r, c;
          do { r = ri(0, n - 1); c = ri(0, n - 1); } while (r + dr < 0 || r + dr >= n || c + dc < 0 || c + dc >= n);
          refs = [at(r, c)]; ans = at(r + dr, c + dc);
        }
        const X = refs[0], Y = refs[1];
        const ask = {
          above: vien('Cái gì ở ngay trên ' + X.n + '?', 'What is right above the ' + X.en + '?'),
          below: vien('Cái gì ở ngay dưới ' + X.n + '?', 'What is right below the ' + X.en + '?'),
          left: vien('Cái gì ở ngay bên trái ' + X.n + '?', 'What is just to the left of the ' + X.en + '?'),
          right: vien('Cái gì ở ngay bên phải ' + X.n + '?', 'What is just to the right of the ' + X.en + '?'),
          between: Y && vien('Cái gì ở giữa ' + X.n + ' và ' + Y.n + '?', 'What is between the ' + X.en + ' and the ' + Y.en + '?'),
        }[rel];
        const board = '<div class="grid" style="--n:' + n + '">' + items.map(x => '<span class="' + (refs.includes(x) ? 'ref' : '') + '">' + x.e + '</span>').join('') + '</div>';
        const others = sample(items.filter(x => x !== ans && !refs.includes(x)), n === 2 ? 2 : 3);
        const opts = shuffle([ans].concat(others)).map(x => ({ v: x.e, html: x.e }));
        return { ask, board, opts, ans: ans.e, cols: opts.length === 4 ? 2 : 3, praise: vien('Đúng rồi! Là ' + ans.n + '.', 'That’s right! It’s the ' + ans.en + '.') };
      },
    },
    {
      id: 'thutu', icon: '🐣', name: ['Chuyện gì tiếp theo?', 'What happens next?'], desc: ['Sắp xếp theo thứ tự', 'Put things in order'],
      make(d) {
        const seq = pick(SEQS.filter(s => d === 0 ? s.length <= 4 : true));
        const show = d === 0 ? seq.length - 1 : seq.length;
        // Bé lớn: chỗ trống có thể ở giữa
        const hole = d >= 2 && R() < .5 ? ri(1, seq.length - 2) : show === seq.length ? seq.length - 1 : show;
        const ans = seq[hole];
        const cells = seq.slice(0, Math.max(show, hole + 1)).map((e, i) => i === hole ? '<b class="q">?</b>' : '<b>' + e + '</b>');
        const same = d >= 1 ? seq.filter(e => e !== ans) : [];
        const far = SEQS.filter(s => s !== seq).flat().filter(e => !seq.includes(e));
        const k = d === 0 ? 3 : 4;
        const pickd = sample(same, Math.min(same.length, d >= 2 ? 2 : 1));
        const opts = shuffle([ans].concat(pickd, sample([...new Set(far)], k - 1 - pickd.length))).map(v => ({ v, html: v }));
        const middle = hole < seq.length - 1 && hole < Math.max(show, hole + 1) - 1;
        return { ask: middle ? vien('Cái gì còn thiếu?', 'What is missing?') : vien('Tiếp theo là gì?', 'What comes next?'), board: '<div class="seq">' + cells.join('<span class="op">➜</span>') + '</div>', opts, ans, cols: k === 4 ? 2 : 3 };
      },
    },
  ];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  // ---------- Trang chủ ----------
  const starKey = g => g + '-' + store.age;
  // Đổi chữ cố định trên trang theo ngôn ngữ đang chọn
  function applyLang() {
    document.documentElement.lang = L();
    document.title = t('title');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = t(el.dataset.tp); el.setAttribute('aria-label', t(el.dataset.tp)); });
    document.querySelectorAll('[data-ta]').forEach(el => el.setAttribute('aria-label', t(el.dataset.ta)));
  }
  function renderHome() {
    applyLang();
    $('langs').innerHTML = LANGS.map(([k, flag, name]) => '<button class="lang" data-lang="' + k + '" aria-pressed="' + (L() === k) + '"><b>' + flag + '</b>' + name + '</button>').join('');
    $('ages').innerHTML = AGES.map((ic, i) => '<button class="age" data-age="' + i + '" aria-pressed="' + (store.age === i) + '"><b>' + ic + '</b>' + t('age')(i) + '</button>').join('');
    $('games').innerHTML = GAMES.map((g, i) => {
      const s = store.best[starKey(g.id)] || 0;
      return '<button class="game" data-g="' + i + '"><span class="ic">' + g.icon + '</span><h3>' + vien(...g.name) + '</h3><small>' + vien(...g.desc) + '</small><span class="st" aria-label="' + t('stars')(s) + '">' + [1, 2, 3].map(k => '<span class="' + (k <= s ? '' : 'off') + '">⭐</span>').join('') + '</span></button>';
    }).join('');
    $('optSound').checked = store.sound; $('optVoice').checked = store.voice; $('optAi').checked = store.ai;
    $('aiKeyInput').value = store.aiKey || '';
    aiStatus();
  }
  $('ages').addEventListener('click', e => {
    const b = e.target.closest('.age'); if (!b) return;
    store.age = +b.dataset.age; save(); sfx.tap(); renderHome();
    say(t('ageSay')(store.age));
  });
  $('langs').addEventListener('click', e => {
    const b = e.target.closest('.lang'); if (!b) return;
    store.lang = b.dataset.lang; save(); sfx.tap(); renderHome();
    say(t('hello'));
  });
  $('games').addEventListener('click', e => {
    const b = e.target.closest('.game'); if (!b) return;
    sfx.tap(); start(+b.dataset.g);
  });
  $('optSound').addEventListener('change', e => { store.sound = e.target.checked; save(); });
  $('optVoice').addEventListener('change', e => { store.voice = e.target.checked; save(); });
  $('optAi').addEventListener('change', e => { store.ai = e.target.checked; save(); aiStatus(); });
  $('aiKeySave').addEventListener('click', () => {
    store.aiKey = $('aiKeyInput').value.trim(); store.aiModel = ''; aiDead = ''; save(); aiStatus();
    say(t('hello'));
  });
  $('resetBtn').addEventListener('click', () => {
    if (!confirm(t('resetQ'))) return;
    store.best = {}; save(); renderHome();
  });

  // ---------- Màn chơi ----------
  let game = null;
  function show(id) { $('home').hidden = id !== 'home'; $('play').hidden = id !== 'play'; window.scrollTo(0, 0); }
  function start(gi) {
    game = { gi, g: GAMES[gi], q: 0, mistakes: 0, last: '', upcoming: null };
    show('play'); next();
  }
  function makeOne() {
    // Tránh lặp lại đúng câu vừa hỏi
    let p, tries = 0;
    do { p = game.g.make(store.age); tries++; } while (tries < 6 && p.ask + p.board === game.last);
    return p;
  }
  function next() {
    const p = game.upcoming || makeOne();
    game.last = p.ask + p.board;
    // Soạn sẵn câu tiếp theo để giọng AI kịp tạo trước
    game.upcoming = game.q + 1 < ROUND ? makeOne() : null;
    if (game.upcoming) { prefetch(game.upcoming.ask); prefetch(game.upcoming.praise); }
    prefetch(p.praise);
    game.p = p; game.wrongHere = 0; game.locked = false;
    $('dots').innerHTML = [...Array(ROUND)].map((_, i) => '<i class="' + (i < game.q ? 'done' : i === game.q ? 'now' : '') + '"></i>').join('');
    setAsk(p.ask, '🦉', '');
    $('board').innerHTML = p.board;
    $('board').hidden = !p.board;
    const pile = $('board').querySelector('.pile');
    if (p.tap && pile) pile.classList.add('tap');
    const opts = $('opts');
    opts.style.setProperty('--cols', p.cols || Math.min(p.opts.length, 4));
    opts.innerHTML = p.opts.map((o, i) => '<button class="opt' + (o.panel ? ' panel' : '') + (o.word ? ' word' : '') + '" data-i="' + i + '"' + (o.wide ? ' style="grid-column:1/-1"' : '') + '>' + o.html + '</button>').join('');
    say(p.ask);
  }
  function setAsk(text, face, mood) {
    $('askText').textContent = text; $('face').textContent = face; $('ask').className = 'ask' + (mood ? ' ' + mood : '');
  }
  // Đếm hình: chạm vào từng hình để đánh dấu, giúp bé đếm không sót
  $('board').addEventListener('click', e => {
    const s = e.target.closest('.pile.tap span'); if (!s) return;
    s.classList.toggle('ticked'); sfx.tap();
    const n = $('board').querySelectorAll('.ticked').length;
    if (s.classList.contains('ticked')) say(String(n));
  });
  $('opts').addEventListener('click', e => {
    const b = e.target.closest('.opt'); if (!b || game.locked || b.classList.contains('wrong')) return;
    const o = game.p.opts[+b.dataset.i];
    if (o.v === game.p.ans) {
      game.locked = true; b.classList.add('right'); sfx.ting();
      const msg = game.p.praise || pick(t('praise'));
      setAsk(msg, '🥳', 'good');
      // Đợi đọc xong lời khen rồi mới sang câu mới
      const g = game;
      Promise.all([say(msg), new Promise(r => setTimeout(r, 1200))]).then(() => {
        if (game !== g || $('play').hidden) return;
        game.q++; if (game.q >= ROUND) win(); else next();
      });
    } else {
      b.classList.add('wrong'); sfx.boing(); game.mistakes++; game.wrongHere++;
      const msg = pick(t('tryAgain')); setAsk(msg, '🤗', 'oops'); say(msg);
      // Sai 2 lần thì làm sáng đáp án đúng
      if (game.wrongHere >= 2) {
        const i = game.p.opts.findIndex(x => x.v === game.p.ans);
        $('opts').children[i].classList.add('hint');
      }
      setTimeout(() => { if (game && !game.locked) setAsk(game.p.ask, '🦉', ''); }, 1800);
    }
  });
  $('sayBtn').addEventListener('click', () => { sfx.tap(); say($('askText').textContent); });
  $('backBtn').addEventListener('click', () => { sfx.tap(); stopVoice(); game = null; renderHome(); show('home'); });

  function win() {
    const m = game.mistakes, stars = m <= 1 ? 3 : m <= 4 ? 2 : 1, k = starKey(game.g.id);
    store.best[k] = Math.max(store.best[k] || 0, stars); save();
    sfx.win();
    const title = pick(t('winTitle'));
    $('winTitle').textContent = title;
    $('winStars').innerHTML = [1, 2, 3].map(n => '<span class="' + (n <= stars ? '' : 'off') + '">⭐</span>').join('');
    const note = t(stars === 3 ? 'winAll' : 'winSome')(ROUND);
    $('winNote').textContent = note;
    say(title + ' ' + note);
    $('winBox').hidden = false; confetti();
  }
  $('againBtn').addEventListener('click', () => { $('winBox').hidden = true; start(game.gi); });
  // Có giọng AI thì tạo sẵn các lời khen, lời động viên hay dùng
  setTimeout(() => ['praise', 'tryAgain'].forEach(k => t(k).forEach(prefetch)), 1500);
  $('homeBtn').addEventListener('click', () => { $('winBox').hidden = true; renderHome(); show('home'); });

  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const box = document.createElement('div'); box.className = 'confetti';
    const pool = ['⭐', '🎉', '✨', game.g.icon];
    for (let k = 0; k < 28; k++) {
      const s = document.createElement('span');
      s.textContent = pool[k % pool.length];
      s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
      s.style.animationDelay = Math.random() * .6 + 's';
      box.appendChild(s);
    }
    document.body.appendChild(box); setTimeout(() => box.remove(), 3800);
  }

  renderHome();
  // Để kiểm thử: window.__beTuDuy.make(id, d) trả về một câu đố
  window.__beTuDuy = { make: (id, d) => GAMES.find(g => g.id === id).make(d) };
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>

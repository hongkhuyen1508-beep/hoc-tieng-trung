<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Học tiếng Trung">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
</head><body>
<title>Nói tiếng Trung mỗi ngày</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: một cột kiểu cuộc trò chuyện, rộng tối đa 760px; trên iPad và máy tính danh sách bài chia hai cột. */
:root {
  --paper: #f6f5f0;
  --surface: #ffffff;
  --ink: #1d1c1a;
  --muted: #6c6862;
  --line: #e5e2da;
  --seal: #cf3b2b;        /* đỏ son như dấu triện */
  --seal-ink: #ffffff;
  --seal-soft: #f8e3df;
  --m: #2c6e63;           /* nhân vật nam: xanh ngọc */
  --m-soft: #e3efec;
  --f: #a24470;           /* nhân vật nữ: tím mận */
  --f-soft: #f5e5ed;
  --good: #23784a;
  --good-soft: #e1f1e7;
  --ok: #a86b12;
  --ok-soft: #f6ecd9;
  --bad: #c0362a;
  --bad-soft: #f8e1de;
  --gold: #c39331;
  --ghost: #ddd7cb;       /* nét mờ khi tập viết */
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-zh: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-zh-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151513; --surface: #1f1e1b; --ink: #f1efe9; --muted: #a39e95; --line: #34322d;
    --seal: #e5574a; --seal-ink: #1a0d0b; --seal-soft: #3a201d;
    --m: #6cc1b1; --m-soft: #1c2f2b; --f: #e08ab0; --f-soft: #36202b;
    --good: #5fcf8e; --good-soft: #193526; --ok: #e3ac4f; --ok-soft: #3a2d15; --bad: #f07a6e; --bad-soft: #3d1f1c; --gold: #e0b55a; --ghost: #4a463f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151513; --surface: #1f1e1b; --ink: #f1efe9; --muted: #a39e95; --line: #34322d;
  --seal: #e5574a; --seal-ink: #1a0d0b; --seal-soft: #3a201d;
  --m: #6cc1b1; --m-soft: #1c2f2b; --f: #e08ab0; --f-soft: #36202b;
  --good: #5fcf8e; --good-soft: #193526; --ok: #e3ac4f; --ok-soft: #3a2d15; --bad: #f07a6e; --bad-soft: #3d1f1c; --gold: #e0b55a; --ghost: #4a463f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--seal) 55%, transparent); outline-offset: 2px; }
.zh { font-family: var(--font-zh); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }

/* ---------- Trang chủ ---------- */
.hero { padding-block: 28px 8px; display: grid; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.seal { width: 52px; height: 52px; border-radius: 10px; background: var(--seal); color: var(--seal-ink); display: grid; place-items: center; font-family: var(--font-zh-display); font-weight: 900; font-size: 15px; line-height: 1.05; text-align: center; transform: rotate(-4deg); flex: none; letter-spacing: .05em; }
.brand-name { font-weight: 700; font-size: 15px; }
.brand-sub { font-size: 13px; color: var(--muted); }
h1 { font-size: clamp(26px, 6.4vw, 38px); line-height: 1.18; margin: 6px 0 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 em { font-style: normal; color: var(--seal); }
.lead { margin: 0; color: var(--muted); font-size: 17px; max-width: 60ch; }
.steps { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 4px 0 0; list-style: none; }
.steps li { font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.steps b { color: var(--seal); }
.section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 10px; font-weight: 600; }
.grid { display: grid; gap: 10px; grid-template-columns: 1fr; padding-bottom: 32px; }
@media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
.card { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; transition: transform .15s, border-color .15s; min-width: 0; }
.card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--seal) 45%, var(--line)); }
.card-mark { width: 54px; height: 54px; border-radius: 14px; background: var(--paper); display: grid; place-items: center; font-family: var(--font-zh-display); font-weight: 900; font-size: 24px; color: var(--seal); border: 1px solid var(--line); }
.card-body { min-width: 0; }
.card-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.pill { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--seal-soft); color: var(--seal); }
.card-title { font-size: 20px; font-weight: 500; margin-top: 2px; }
.card-vi { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { display: flex; gap: 4px; margin-top: 8px; align-items: center; }
.prog i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); }
.prog i.on { background: var(--good); }
.prog span { font-size: 12px; color: var(--muted); margin-left: 6px; }

/* ---------- Trang bài học ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.back { border: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; width: 38px; height: 38px; display: grid; place-items: center; flex: none; }
.topbar-title { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.topbar-title span { font-weight: 400; color: var(--muted); }
.lesson-head { padding-block: 18px 6px; }
.lesson-head h2 { font-family: var(--font-zh-display); font-weight: 900; font-size: clamp(30px, 8vw, 42px); margin: 0; line-height: 1.15; }
.lesson-head .py { font-size: 17px; color: var(--muted); }
.lesson-head p { margin: 6px 0 0; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 9px 6px; font-weight: 600; font-size: 14px; line-height: 1.2; }
.tab small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); margin-top: 2px; }
.tab[aria-selected="true"] { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); }
.tab[aria-selected="true"] small { color: inherit; opacity: .85; }
@media (max-width: 420px) { .tab small { display: none; } .tab { padding: 11px 4px; font-size: 13px; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.vocab { display: grid; grid-template-columns: 1fr; gap: 8px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 16px; }
@media (min-width: 560px) { .vocab { grid-template-columns: 1fr 1fr; } }
.vocab div { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.vocab b { font-family: var(--font-zh); font-weight: 500; font-size: 19px; }

.panel { padding-bottom: 140px; }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.btn { border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary { background: var(--seal); color: var(--seal-ink); }
.btn-dark { background: var(--ink); color: var(--paper); }
.btn-ghost { background: var(--surface); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* Bong bóng hội thoại */
.thread { display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; align-items: flex-end; gap: 10px; }
.msg.right { flex-direction: row-reverse; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-zh); font-weight: 700; font-size: 17px; flex: none; position: relative; }
.av.male { background: var(--m); } .av.female { background: var(--f); }
.av.talking::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 3px solid var(--gold); animation: ring 1s ease-out infinite; }
@keyframes ring { from { opacity: 1; transform: scale(.92); } to { opacity: 0; transform: scale(1.18); } }
.col { display: flex; flex-direction: column; max-width: min(84%, 520px); min-width: 0; }
.msg.right .col { align-items: flex-end; }
.who { font-size: 12px; color: var(--muted); margin: 0 4px 3px; }
.bubble { border-radius: 18px; padding: 10px 14px; border: 1px solid transparent; min-width: 0; }
.msg:not(.right) .bubble { border-bottom-left-radius: 6px; }
.msg.right .bubble { border-bottom-right-radius: 6px; }
.bubble.male { background: var(--m-soft); border-color: color-mix(in srgb, var(--m) 18%, transparent); }
.bubble.female { background: var(--f-soft); border-color: color-mix(in srgb, var(--f) 18%, transparent); }
.bubble.now { box-shadow: 0 0 0 2px var(--gold); }
.line-zh { display: flex; gap: 6px; align-items: flex-start; }
.line-zh p { margin: 0; font-family: var(--font-zh); font-size: 21px; line-height: 1.45; overflow-wrap: anywhere; }
.line-zh p.blur { filter: blur(6px); user-select: none; }
.say { border: 0; background: transparent; padding: 4px; margin-top: 2px; border-radius: 50%; color: var(--muted); flex: none; }
.say svg { width: 20px; height: 20px; }
.line-py { margin: 2px 0 0; color: color-mix(in srgb, var(--ink) 70%, transparent); font-size: 15px; }
.line-vi { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.note { margin-top: 8px; padding-top: 8px; border-top: 1px solid color-mix(in srgb, var(--ink) 10%, transparent); font-size: 14px; }

/* Ô trả lời: đọc bằng micro trên bàn phím hoặc gõ */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
.dock .wrap { padding-top: 10px; display: grid; gap: 8px; }
.answer { display: flex; gap: 8px; }
.answer input { flex: 1; min-width: 0; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 12px 16px; font-family: var(--font-zh); font-size: 18px; outline: none; }
.answer input:focus { border-color: var(--ink); }
.hint { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; }
.hint svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--seal); }

/* Luyện nói */
.drill { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 20px; }
.drill-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
.drill-who { display: flex; align-items: center; gap: 8px; }
.drill-who .av { width: 30px; height: 30px; font-size: 14px; }
.drill-zh { font-family: var(--font-zh); font-size: clamp(26px, 7vw, 36px); line-height: 1.35; margin: 0; overflow-wrap: anywhere; }
.drill-py { font-size: 18px; color: color-mix(in srgb, var(--ink) 70%, transparent); margin: 6px 0 0; }
.drill-vi { color: var(--muted); margin: 4px 0 0; }
.drill .answer { margin-top: 16px; }
.nav { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; }
.result { margin-top: 14px; border-radius: 16px; padding: 14px; background: var(--paper); border: 1px solid var(--line); }
.score { display: flex; align-items: baseline; gap: 10px; }
.score b { font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.chars { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.chars span { font-family: var(--font-zh); font-size: 20px; padding: 1px 6px; border-radius: 7px; }
.c-good { color: var(--good); } .c-ok { color: var(--ok); } .c-bad { color: var(--bad); }
.chars .hit { background: var(--good-soft); color: var(--good); }
.chars .miss { background: var(--bad-soft); color: var(--bad); }
.list { display: grid; gap: 6px; margin-top: 16px; }
.row { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; text-align: left; }
.row.cur { border-color: var(--seal); background: var(--seal-soft); }
.row .zh { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row small { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Chọn vai */
.roles { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .roles { grid-template-columns: 1fr 1fr; } }
.role { display: flex; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.role .av { width: 52px; height: 52px; font-size: 22px; }
.role-name { font-family: var(--font-zh); font-size: 21px; font-weight: 500; }
.callout { border-radius: 16px; padding: 14px 16px; background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent); font-size: 15px; }
.callout b { display: block; margin-bottom: 2px; }
.suggest { width: 100%; text-align: left; border: 1.5px dashed color-mix(in srgb, var(--gold) 60%, transparent); background: color-mix(in srgb, var(--gold) 8%, var(--surface)); border-radius: 14px; padding: 8px 12px; font-size: 14px; }
.suggest .zh { font-size: 17px; }
.typing { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; }
.dots i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 3px; animation: blink 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }

/* Cài đặt giọng */
details.voices { margin: 0 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 14px; }
details.voices summary { cursor: pointer; font-weight: 600; }
.sets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.voice-row { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; margin-top: 10px; }
.voice-row select { min-width: 0; width: 100%; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; }

/* ---------- Chuyển mục trên trang chủ ---------- */
.switch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-top: 18px; }
@media (max-width: 560px) { .switch { grid-template-columns: repeat(2, 1fr); } }
.add-card { border-style: dashed; }
.add-card .card-mark { font-size: 28px; color: var(--seal); }
.field { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; outline: none; font-size: 16px; }
.field:focus { border-color: var(--ink); }
textarea.field { font-family: var(--font-zh); line-height: 1.6; resize: vertical; }
.callout.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.yt { margin-bottom: 16px; }
.yt-frame { position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000; }
.yt-frame.tall { aspect-ratio: auto; height: min(58vh, 520px); max-width: 320px; margin: 0 auto; }
.radio { width: 100%; }
.yt-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
@media (max-width: 760px) { .yt.has-frame { position: sticky; top: 63px; z-index: 5; background: var(--paper); padding: 6px 0 8px; } .yt.has-frame .bar .btn { padding: 8px 14px; font-size: 14px; } }
.rd-text { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 10px; }
.rl { display: grid; gap: 2px; text-align: left; border: 0; background: transparent; border-radius: 14px; padding: 10px 12px; }
.rl:hover { background: var(--paper); }
.rl.now { background: color-mix(in srgb, var(--gold) 16%, var(--surface)); box-shadow: inset 3px 0 0 var(--gold); }
.rl-zh { font-size: 22px; line-height: 1.5; overflow-wrap: anywhere; }
.rl-py { font-size: 15px; color: color-mix(in srgb, var(--ink) 70%, transparent); }
.rl-vi { font-size: 14px; color: var(--muted); }
.rl-who { font-size: 13px; font-weight: 600; font-family: var(--font-zh); }
.rl-who.male { color: var(--m); } .rl-who.female { color: var(--f); }
.rd-text.no-py .rl-py, .rd-text.no-vi .rl-vi { display: none; }
.rl { scroll-margin-top: 330px; }
.sync-bar { align-items: center; gap: 6px; }
.sync-bar .chip { font-size: 13px; padding: 5px 10px; }
.rd-text.verse .rl { text-align: center; justify-items: center; }
.rd-text.verse .rl-zh { font-size: 26px; letter-spacing: .06em; }
.switch button { border: 0; background: transparent; border-radius: 12px; padding: 10px 8px; font-weight: 600; font-size: 15px; line-height: 1.25; }
.switch button small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.switch button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.switch button[aria-selected="true"] small { color: inherit; opacity: .75; }
.levels { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 0; }
.levels .chip { margin: 0; }

/* ---------- Tập viết: trang chủ ---------- */
.how { display: grid; gap: 8px; grid-template-columns: 1fr; margin: 16px 0 0; padding: 0; list-style: none; counter-reset: how; }
@media (min-width: 560px) { .how { grid-template-columns: repeat(3, 1fr); } }
.how li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 14px; color: var(--muted); counter-increment: how; }
.how li b { display: block; color: var(--ink); }
.how li b::before { content: counter(how) ". "; color: var(--seal); }
.review { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; background: var(--seal-soft); border: 1px solid color-mix(in srgb, var(--seal) 25%, transparent); border-radius: var(--r); padding: 16px; margin-top: 18px; }
.review .big { font-family: var(--font-zh-display); font-weight: 900; font-size: 40px; color: var(--seal); line-height: 1; min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
.review p { margin: 2px 0 10px; font-size: 14px; color: var(--muted); }
.review .bar { margin: 0; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; display: flex; }
.meter i { display: block; height: 100%; }
.meter .k { background: var(--good); } .meter .l { background: var(--ok); }
.deck-stats { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; background: var(--line); }
.dot.known { background: var(--good); } .dot.learn { background: var(--ok); }

/* ---------- Tập viết: luyện từng chữ ---------- */
.word { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px; }
.word-top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.word-top > div { min-width: 0; }

<script>
/* Bản trên GitHub: dùng AI của Google (khóa của người học, lưu trên máy) thay cho AI của Claude. */
window.HOSTED = true;
(() => {
  const KEY = "goi-key";
  const getKey = () => { try { return JSON.parse(localStorage.getItem(KEY) || '""'); } catch { return ""; } };
  // Mô hình nào đang quá tải thì thử mô hình kế tiếp; nhớ mô hình chạy được lần trước.
  const MODELS = ["gemini-flash-latest", "gemini-3.5-flash", "gemini-3.8-flash", "gemini-flash-lite-latest"];
  async function call(contents, json) {
    let last, good = "";
    try { good = localStorage.getItem("goi-goodModel") || ""; } catch {}
    for (const m of [...new Set([good, ...MODELS].filter(Boolean))]) {
      let r;
      try { r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(getKey())}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents, generationConfig: json ? { responseMimeType: "application/json" } : {} }),
      }); } catch (e) { last = Object.assign(new Error("Không kết nối được tới AI của Google"), { code: "error" }); continue; }
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        last = Object.assign(new Error(d?.error?.message || "HTTP " + r.status), { code: r.status === 429 ? "rate_limited" : r.status === 400 || r.status === 403 ? "not_granted" : "error" });
        if ([404, 429, 500, 503].includes(r.status)) continue;
        throw last;
      }
      try { localStorage.setItem("goi-goodModel", m); } catch {}
      return (d.candidates?.[0]?.content?.parts || []).map((p) => p.text || "").join("");
    }
    throw last;
  }
  const toContents = (input) => typeof input === "string" ? [{ role: "user", parts: [{ text: input }] }]
    : input.map((m) => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] }));
  const parse = (t) => JSON.parse(t.trim().replace(/^```(json)?/, "").replace(/```$/, "").trim());
  const sample = async (input, opts = {}) => { const text = await call(toContents(input), false); opts.onText?.({ text, delta: text }); return { text, truncated: false }; };
  sample.json = async (input) => {
    const t = await call(toContents(input), true);
    try { return parse(t); } catch { throw Object.assign(new Error("invalid_json"), { code: "invalid_json", text: t }); }
  };
  window.gemini = {
    key: getKey,
    setKey: (k) => { try { localStorage.setItem(KEY, JSON.stringify(k)); } catch {} },
    video: async (url, prompt) => parse(await call([{ role: "user", parts: [{ file_data: { file_uri: url } }, { text: prompt }] }], true)),
  };
  window.claude = { use: async (name) => (name === "sample" && getKey() ? sample : null) };
})();
</script>

/* ---------------- Giọng đọc của thiết bị ---------------- */
const synth = window.speechSynthesis;
let zhVoices = [];
const MALE_HINT = /(li-?mu|yunxi|yunyang|yunjian|kangkang|male|男|xiaobei|yu-?shu.*male|dong)/i;
function loadVoices() {
  if (!synth) return;
  const all = synth.getVoices();
  const zh = all.filter((v) => /^(zh|cmn)/i.test(v.lang));
  const rank = (v) => (/(CN|Hans)/i.test(v.lang) ? 0 : 1) + (v.localService ? 0 : 0.1);
  zhVoices = zh.sort((a, b) => rank(a) - rank(b));
  if (state.view === "lesson") renderVoicePicker();
}

function voiceFor(gender) {
  const saved = store.get("voice-" + gender, null);
  const pick = zhVoices.find((v) => v.voiceURI === saved);
  if (pick) return pick;
  const male = zhVoices.find((v) => MALE_HINT.test(v.name));
  const female = zhVoices.find((v) => !MALE_HINT.test(v.name));
  if (gender === "male") return male || zhVoices[1] || zhVoices[0] || null;
  return female || zhVoices[0] || null;
}

// Mỗi cảm xúc chỉnh nhẹ cao độ và tốc độ để câu thoại có sắc thái hơn.
const MOOD = {
  cheerful: [1.12, 1.04], friendly: [1.05, 1], calm: [1, 0.96], sad: [0.88, 0.88], surprised: [1.18, 1.06],
  sorry: [0.95, 0.92], hesitant: [0.98, 0.86], serious: [0.93, 0.98],
};
let speakToken = 0;
// Âm thanh tạo sẵn bằng giọng AI cho mọi câu thoại trong bài. Dùng một thẻ audio duy nhất
// để iPhone/iPad cho phép phát liên tiếp sau lần chạm đầu tiên.
const player = new Audio();
player.preload = "auto";
let clipDone = null;
function stopSpeaking() {
  speakToken++; synth?.cancel();
  player.pause(); if (clipDone) { const d = clipDone; clipDone = null; d(); }
}
// Phát một đoạn âm thanh; nếu không phát được thì đọc bằng giọng của máy.
function playSrc(src, fallback, rate = 1) {
  stopSpeaking();
  const token = speakToken;
  return new Promise((resolve) => {
    let done = false;
    const finish = () => { if (!done) { done = true; clipDone = null; player.onended = player.onerror = null; resolve(); } };
    const fail = () => { if (done || token !== speakToken) return; done = true; clipDone = null; player.onended = player.onerror = null; Promise.resolve(fallback()).then(resolve); };
    clipDone = finish;
    player.onended = finish;
    player.onerror = fail;
    player.src = src;
    player.playbackRate = rate;
    try { player.preservesPitch = true; } catch {}
    player.play().catch(fail);
  });
}
function playLineAudio(lesson, idx) {
  const ln = lesson.lines[idx];
  const gender = lesson.characters.find((c) => c.id === ln.speaker).gender;
  return playSrc(`audio/${lesson.id}-${idx}-${state.voiceSet}.mp3`, () => speak(ln.zh, gender, ln.emotion), state.slow ? 0.8 : 1);
}
function speak(text, gender, emotion = "friendly") {
  return new Promise((resolve) => {
    if (!synth) return resolve();
    const token = ++speakToken;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = voiceFor(gender);
    u.lang = v?.lang || "zh-CN";
    try { if (v) u.voice = v; } catch {}
    const [p, r] = MOOD[emotion] || [1, 1];
    // Nếu máy chỉ có một giọng tiếng Trung, hạ giọng nam xuống để hai nhân vật nghe khác nhau.
    const sameVoice = voiceFor("male") === voiceFor("female");
    const base = gender === "male" ? (sameVoice ? 0.72 : 0.95) : 1.08;
    u.pitch = Math.min(2, Math.max(0.1, base * p));
    u.rate = Math.max(0.5, (state.slow ? 0.72 : 0.95) * r);
    let done = false;
    const finish = () => { if (!done) { done = true; clearTimeout(guard); resolve(); } };
    u.onend = finish; u.onerror = finish;
    // Một số trình duyệt quên gọi onend: tự kết thúc sau thời gian ước tính.
    const guard = setTimeout(finish, 1500 + text.length * 450 / u.rate);
    synth.speak(u);
    if (token !== speakToken) finish();
  });
}

/* ---------------- Chấm điểm theo âm tiết pinyin ---------------- */
const hanOnly = (s) => (s.match(/[一-鿿]/g) || []).join("");
const stripTone = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ü/g, "v").toLowerCase();
function syllables(text) {
  const han = hanOnly(text);
  if (han && window.pinyinPro) return pinyinPro.pinyin(han, { toneType: "none", type: "array" }).map((x) => x.replace(/ü/g, "v"));
  if (han) return [...han];
  // Người học gõ pinyin: tách theo khoảng trắng hoặc dấu câu.
  return stripTone(text).split(/[^a-z]+/).filter(Boolean);
}
function scoreAnswer(reference, answer) {
  const refChars = [...hanOnly(reference)];
  const usePinyin = !!window.pinyinPro || !hanOnly(answer);
  const ref = usePinyin && window.pinyinPro ? pinyinPro.pinyin(refChars.join(""), { toneType: "none", type: "array" }).map((x) => x.replace(/ü/g, "v")) : refChars;
  let got = syllables(answer);
  // Pinyin gõ liền ("nihao") thì so khớp theo chuỗi ký tự.
  if (!hanOnly(answer) && got.length < ref.length / 2) {
    const flat = got.join(""); got = []; let rest = flat;
    for (const s of ref) { if (rest.startsWith(s)) { got.push(s); rest = rest.slice(s.length); } }
    if (rest) got.push(rest);
  }
  const n = ref.length, m = got.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = ref[i] === got[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ok = new Array(n).fill(false);
  for (let i = 0, j = 0; i < n && j < m; ) {
    if (ref[i] === got[j]) { ok[i] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  const hit = ok.filter(Boolean).length;
  const extra = Math.max(0, m - hit);
  const score = n ? Math.max(0, Math.min(100, Math.round((hit / n) * 100 - extra * 4))) : 0;
  return { score, chars: refChars.map((c, i) => ({ c, ok: ok[i] })) };
}

    // Chưa có chữ tới hạn: ôn thêm 10 chữ đã học, ưu tiên chữ chưa nhớ chắc.
    queue = Object.keys(srs).sort((a, b) => srs[a].b - srs[b].b || Math.random() - 0.5).slice(0, 10);

  }
  if (!queue.length) return;
  state.view = "write";
  state.w = { deck: null, wi: 0, ci: 0, mode: "recall", result: null, review: { queue, qi: 0, extra, good: 0 } };

  render(); window.scrollTo(0, 0);
}
function curWord() {

}
function curChars() {
  const w = state.w;
  return w.review ? [w.review.queue[w.review.qi]] : hanChars(curWord().zh);
}
function goWord(i) {
  const w = state.w, n = deckWords(w.deck).length;
  w.wi = (i + n) % n; w.ci = 0; w.mode = "watch"; w.result = null;

  document.querySelector(".word")?.scrollIntoView({ block: "start", behavior: "smooth" });
}

      ${!rv || w.result ? `<div class="padlabel"><b class="zh">${esc(c)}</b><span>${esc(cpy)}</span>${chv ? `<span class="hv" style="margin:0">${esc(chv)}</span>` : ""}</div>` : ""}

function statusText() {
  const w = state.w, r = w.result, c = curChars()[w.ci];
  if (w.loadError) return `<b class="c-bad">Chưa tải được nét chữ.</b> Kiểm tra mạng rồi bấm Thử lại.`;
  if (w.mode === "watch") return w.strokes ? `Chữ <b class="zh">${esc(c)}</b> có ${w.strokes} nét. Nhìn kỹ thứ tự rồi sang bước Viết theo.` : "Đang vẽ thứ tự nét...";
  if (!r) return w.mode === "trace" ? "Dùng ngón tay tô lên nét mờ, viết đúng thứ tự từng nét. Sai 2 lần sẽ có gợi ý." : w.review ? "Nhớ lại và viết chữ còn thiếu vào ô. Sai 3 lần sẽ có gợi ý." : "Tự viết, không có nét mờ. Sai 3 lần sẽ có gợi ý.";
  if (r.reveal) return `Chữ cần viết là <b class="zh">${esc(c)}</b>. Nhìn kỹ rồi bấm Viết lại để tập, ngày mai sẽ ôn lại chữ này.`;
  if (w.mode === "trace") return `<b class="c-${r.m <= 1 ? "good" : "ok"}">Xong! Sai ${r.m} lần.</b> Giờ thử tự viết không nhìn nét mờ.`;
  if (r.m <= 1) return `<b class="c-good">Tuyệt, bạn nhớ chữ này rồi!</b> Lần ôn tới: sau ${r.gap} ngày.`;
  if (r.m <= 3) return `<b class="c-ok">Khá rồi, sai ${r.m} lần.</b> Mai mình ôn lại chữ này nhé.`;
  return `<b class="c-bad">Sai ${r.m} lần.</b> Xem lại thứ tự nét rồi viết lại nhé.`;
}
function writeActions() {
  const w = state.w, chars = curChars(), lastChar = w.ci >= chars.length - 1;
  const next = w.review ? `<button class="btn btn-primary" data-wnext>Chữ tiếp →</button>`
    : `<button class="btn btn-primary" data-wnext>${lastChar ? "Từ tiếp →" : "Chữ tiếp →"}</button>`;
  if (w.loadError) return `<button class="btn btn-dark" data-wretry>Thử lại</button>`;
  if (w.mode === "watch") return `<button class="btn btn-ghost" data-wretry>${ICON.play}Xem lại</button><button class="btn btn-dark" data-wmode="trace">Viết theo →</button>`;
  if (w.mode === "trace") return w.result
    ? `<button class="btn btn-ghost" data-wretry>Viết lại</button><button class="btn btn-dark" data-wmode="recall">Tự viết →</button>`
    : `<button class="btn btn-ghost" data-wretry>Xóa, viết lại</button>`;
  if (!w.result) return w.review ? `<button class="btn btn-ghost" data-wreveal>Quên rồi, xem chữ</button>` : `<button class="btn btn-ghost" data-wmode="watch">Xem lại nét</button><button class="btn btn-ghost" data-wretry>Xóa, viết lại</button>`;
  return `<button class="btn btn-ghost" data-wretry>Viết lại</button>${next}`;
}
function refreshWriteUI() {
  const s = $("#wstatus"); if (s) s.innerHTML = statusText();
  const a = $(".wact"); if (a) a.innerHTML = writeActions();
}

let writer = null;
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function mountWriter() {
  const el = document.getElementById("hw");
  if (!el) return;
  const w = state.w, c = curChars()[w.ci];
  w.loadError = false;
  if (!window.HanziWriter) { w.loadError = true; refreshWriteUI(); return; }
  const size = Math.round(el.clientWidth) || 280;
  const done = !!w.result && w.mode === "recall";
  writer = HanziWriter.create(el, c, {
    width: size, height: size, padding: Math.round(size * 0.07),
    showOutline: w.mode !== "recall" || done, showCharacter: done,
    strokeColor: cssVar("--ink"), outlineColor: cssVar("--ghost"), drawingColor: cssVar("--seal"),
    highlightColor: cssVar("--gold"), radicalColor: null,
    drawingWidth: Math.max(16, Math.round(size / 15)), strokeAnimationSpeed: 0.9, delayBetweenStrokes: 280,
    charDataLoader: (ch, onLoad, onError) => {
      charData(ch).then((d) => { if (!d) throw new Error("missing"); onLoad(d); })
        .catch(() => { w.loadError = true; refreshWriteUI(); onError && onError(); });
    },
    onLoadCharDataSuccess: (d) => { w.strokes = d.strokes.length; if (w.mode === "watch") refreshWriteUI(); },
  });
  const me = writer;
  if (done) return;
  if (w.mode === "watch") { writer.animateCharacter(); return; }
  writer.quiz({
    leniency: 1.25,
    showHintAfterMisses: w.mode === "trace" ? 2 : 3,
    highlightOnComplete: true,
    onMistake: (s) => { if (me === writer) $("#wstatus").innerHTML = `Nét ${s.strokeNum + 1} chưa đúng, thử lại nhé. <span class="muted">Sai ${s.totalMistakes} lần</span>`; },
    onCorrectStroke: (s) => { if (me === writer && s.strokesRemaining) $("#wstatus").innerHTML = `Đúng nét ${s.strokeNum + 1}! Còn ${s.strokesRemaining} nét.`; },
    onComplete: (s) => { if (me === writer) quizDone(s.totalMistakes); },
  });
}
function quizDone(m) {
  const w = state.w, c = curChars()[w.ci];
  if (w.mode === "recall") {
    const r = grade(c, m);
    w.result = { m, gap: GAP[r.b] };
    if (w.review && m <= 1) w.review.good++;
    render();
    playWord(curWord().zh);
  } else {
    w.result = { m };
    refreshWriteUI();
  }
}
function writeNext() {

  if (w.ci < curChars().length - 1) { w.ci++; w.mode = "watch"; w.result = null; render(); return; }
  goWord(w.wi + 1);
}

/* ----- 1. Nghe ----- */
function listenView() {
  const l = L();
  return `<div class="bar"><button class="btn btn-primary" data-playall>${state.playAll ? ICON.stop + "Dừng" : ICON.play + "Nghe cả đoạn hội thoại"}</button><span class="muted" style="font-size:14px">Chạm loa để nghe lại từng câu.</span></div>
    <div class="thread">${l.lines.map((ln, i) => `<div id="ln-${i}">${bubble(ch(ln.speaker), ln, { right: ln.speaker === "B", now: state.playing === i, play: i })}</div>`).join("")}</div>`;
}
async function playLine(i) {
  const ln = L().lines[i];
  state.playAll = false; state.playing = i; render();
  await playLineAudio(L(), i);
  if (state.playing === i && !state.playAll) { state.playing = null; render(); }
}
async function playAll() {
  if (state.playAll) { stopSpeaking(); state.playAll = false; state.playing = null; render(); return; }
  const l = L(); state.playAll = true;
  const my = speakToken + 1;
  for (let i = 0; i < l.lines.length; i++) {
    if (!state.playAll || state.lesson !== l) return;
    state.playing = i; render();
    document.getElementById("ln-" + i)?.scrollIntoView({ behavior: "smooth", block: "center" });
    const ln = l.lines[i];
    await playLineAudio(l, i);
    if (!state.playAll) return;
    const next = l.lines[i + 1];
    await sleep(next && next.speaker !== ln.speaker ? 420 + Math.random() * 260 : 220);
  }
  state.playAll = false; state.playing = null;
  const p = prog(l.id); p.listened = true; saveProg(l.id, p);
  render();
}

const MIC_HINT = `<div class="hint">${ICON.mic}<span>Chạm vào ô, đổi bàn phím sang <b>tiếng Trung (简体)</b> rồi bấm <b>micro trên bàn phím</b> và đọc to. Không tiện nói thì gõ chữ Hán hoặc pinyin cũng được.</span></div>`;

function resultView(r, reference) {

/* ----- 2. Luyện nói ----- */
function drillView() {

  return `<p class="muted" style="margin:0 0 14px">Nghe câu mẫu, rồi đọc lại. Chữ <span class="c-good">xanh</span> là máy nghe đúng, chữ <span class="c-bad">đỏ</span> là cần đọc lại.</p>

    <p class="drill-zh">${esc(ln.zh)}</p>

function recordBest(n, score) {

/* ----- 3. Đóng vai ----- */
function roleView() {
  const l = L();
  if (!state.role) {
    return `<p class="muted" style="margin:0 0 14px">Chọn nhân vật bạn muốn đóng. Máy sẽ nói lời của người còn lại, đến lượt bạn thì bạn đọc câu của mình.</p>
    <div class="roles">${l.characters.map((c) => `<button class="role" data-pickrole="${c.id}">${avatar(c)}<div><div class="muted" style="font-size:13px">Tôi đóng vai</div><div class="role-name">${esc(c.name)}</div><div class="muted" style="font-size:14px">${esc(c.pinyin)} · ${esc(c.vi)}</div></div></button>`).join("")}</div>`;
  }
  const total = l.lines.length, idx = state.shown - 1;
  const cur = l.lines[idx];
  const yourTurn = cur && cur.speaker === state.role && !state.results[idx];
  const finished = state.shown === total && (!yourTurn) && state.speaking == null;
  const scores = Object.values(state.results).map((r) => r.score);
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
  const thread = l.lines.slice(0, state.shown).map((ln, i) => {
    const mine = ln.speaker === state.role, r = state.results[i];
    const extra = mine && r ? `<div class="note"><b class="c-${tone(r.score)}">${r.score} điểm</b> <span class="muted">· bạn nói:</span> <span class="zh">${esc(r.text)}</span></div>` : "";
    return bubble(ch(ln.speaker), ln, { right: mine, now: state.speaking === i, hidden: mine && state.hide && !r, play: null, extra });
  }).join("");
  let dock;
  if (finished) {
    dock = `<div class="bar" style="margin:0"><b>Xong rồi! Điểm trung bình: <span class="c-${tone(avg)}">${avg}</span></b><button class="btn btn-dark" data-pickrole="${state.role}">Làm lại</button><button class="btn btn-ghost" data-pickrole="${state.role === "A" ? "B" : "A"}">Đổi vai</button></div>`;
  } else if (yourTurn) {
    dock = `${answerBox("role-in", "Nói")}${MIC_HINT}`;
  } else if (cur && cur.speaker === state.role && state.results[idx]) {
    dock = `<div class="bar" style="margin:0"><button class="btn btn-primary" data-continue>Tiếp tục →</button><button class="btn btn-ghost" data-retry>Nói lại câu này</button></div>`;
  } else {
    dock = `<div class="typing"><span class="dots"><i></i><i></i><i></i></span><span class="zh">${esc(cur ? ch(cur.speaker).name : "")}</span> đang nói...</div>`;
  }
  return `<div class="bar"><span class="muted" style="font-size:14px">Bạn là <b class="zh" style="color:var(--ink)">${esc(ch(state.role).name)}</b></span>
      <button class="chip" aria-pressed="${state.hide}" data-hide>Thử thách: ẩn chữ của tôi</button>
      <button class="chip" data-pickrole="">Chọn lại vai</button></div>
    <div class="thread">${thread}</div>
    <div class="dock"><div class="wrap">${dock}</div></div>`;
}
async function runRole(from) {
  const l = L(), who = state.role, my = (state.roleRun = (state.roleRun || 0) + 1);
  for (let i = from; i < l.lines.length; i++) {
    const ln = l.lines[i];
    state.shown = i + 1;
    if (ln.speaker === who) { state.speaking = null; render(); scrollBottom(); return; }
    state.speaking = i; render(); scrollBottom();
    await sleep(300);
    if (state.roleRun !== my || state.lesson !== l) return;
    await playLineAudio(l, i);
    if (state.roleRun !== my || state.lesson !== l) return;
  }
  state.speaking = null; render(); scrollBottom();
  const p = prog(l.id); p.role = true; saveProg(l.id, p);
}
function scrollBottom() { requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" })); }

function startCall(opts) {
  stopSpeaking();
  state.call = { ...opts, msgs: [], busy: false, error: "", speaking: null, summary: null, sumBusy: false, start: Date.now(), ended: false, peek: {} };
  state.view = "call";
  render(); window.scrollTo(0, 0);
  askAI();
}
function startCallFromHome() {
  const cs = state.cs, p = PERSONAS.find((x) => x.id === cs.pid) || PERSONAS[0];
  const typed = ($("#topic-in")?.value || "").trim();
  startCall({ name: p.name, py: p.py, vi: p.vi, gender: p.gender, style: p.style, topic: typed || cs.topic || p.topics[0], level: cs.level, lessonId: null });
}
function startLessonCall(roleId) {
  const l = L(), me = ch(roleId), ai = ch(roleId === "A" ? "B" : "A");
  startCall({ name: ai.name, py: ai.pinyin, vi: ai.vi, gender: ai.gender, style: `nhân vật "${ai.name}" (${ai.vi}) trong tình huống của bài`, me: me.name + " (" + me.vi + ")",
    scene: l.scene, script: l.lines.map((x) => `${ch(x.speaker).name}: ${x.zh}`).join("\n"), topic: l.titleVi, level: l.level, lessonId: l.id });
}

const fmtTime = (ms) => { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
setInterval(() => { const t = $("#ctimer"); if (t && state.call && !state.call.ended) t.textContent = fmtTime(Date.now() - state.call.start); }, 1000);

function callView() {
  const c = state.call;
  if (c.ended) return summaryView();
  const who = { name: c.name, vi: c.vi, gender: c.gender };
  const meC = { name: "我", vi: "Bạn", gender: c.gender === "male" ? "female" : "male" };
  const last = c.msgs[c.msgs.length - 1];
  const sugs = last && last.role === "ai" && !c.busy ? last.suggestions || [] : [];
  const status = c.busy ? "đang nghe và suy nghĩ..." : c.speaking != null ? "đang nói..." : c.msgs.length ? "đến lượt bạn nói" : "đang kết nối...";
  const thread = c.msgs.map((m, i) => {
    if (m.role === "ai") {
      const hide = !state.cText && !c.peek[i];
      return `<div class="msg">${avatar(who, c.speaking === i ? "talking" : "")}<div class="col"><div class="bubble ${c.gender} ${c.speaking === i ? "now" : ""}">
        ${hide ? `<button class="peek" data-peek="${i}">Chạm để xem chữ</button>` : `<div class="line-zh"><p>${esc(m.reply)}</p></div>${state.showPy ? `<p class="line-py">${esc(m.reply_pinyin || "")}</p>` : ""}${state.showVi ? `<p class="line-vi">${esc(m.reply_vi || "")}</p>` : ""}`}
        <div class="bub-act"><button data-replay="${i}">${ICON.speaker}Nghe lại</button><button data-replay="${i}" data-slow="1">Nghe chậm</button></div>
      </div></div></div>`;
    }
    const fb = m.fb && (m.fb.feedback_vi || m.fb.corrected) ? `<div class="note">${m.fb.feedback_vi ? `<div>💡 ${esc(m.fb.feedback_vi)}</div>` : ""}${m.fb.corrected && m.fb.corrected !== m.text ? `<div style="margin-top:4px">Nên nói: <span class="zh c-good">${esc(m.fb.corrected)}</span>${m.fb.corrected_pinyin && state.showPy ? `<br><span class="muted">${esc(m.fb.corrected_pinyin)}</span>` : ""}</div>` : ""}</div>` : "";
    return bubble(meC, { zh: m.text }, { right: true, py: "", vi: "", extra: fb });
  }).join("");
  return `<header class="topbar"><div class="wrap">
      <button class="back" data-endcall aria-label="Kết thúc cuộc gọi">${ICON.back}</button>
      <div class="topbar-title">${esc(c.topic || "")}</div><span class="pill" id="ctimer">${fmtTime(Date.now() - c.start)}</span>
    </div></header>
    <div class="wrap">
      <section class="callhead">
        <div class="av ${c.gender} big ${c.speaking != null ? "talking" : ""}" aria-hidden="true">${esc(c.name.slice(0, 1))}</div>
        <div><div class="role-name">${esc(c.name)} <span class="muted" style="font-size:15px">${esc(c.py || "")}</span></div><div class="muted" style="font-size:14px">${esc(status)}</div></div>
        <button class="btn btn-end" data-endcall>${ICON.phone}Kết thúc</button>
      </section>
      <div class="chips">
        <button class="chip" aria-pressed="${state.cText}" data-toggle="cText">Hiện chữ Hán</button>
        <button class="chip" aria-pressed="${state.showPy}" data-toggle="showPy">Pinyin</button>
        <button class="chip" aria-pressed="${state.showVi}" data-toggle="showVi">Tiếng Việt</button>
        <button class="chip" aria-pressed="${state.slow}" data-toggle="slow">Nói chậm</button>
      </div>
      ${!state.cText ? `<p class="muted" style="margin:-6px 0 14px;font-size:14px">Chế độ nghe hiểu: chữ được ẩn, bạn nghe rồi trả lời như gọi điện thật.</p>` : ""}
      <section class="panel" style="padding-bottom:280px"><div class="thread">${thread}
        ${c.busy ? `<div class="typing"><span class="dots"><i></i><i></i><i></i></span><span class="zh">${esc(c.name)}</span> đang trả lời...</div>` : ""}
        ${c.error ? `<div class="callout">${esc(c.error)} <button class="btn btn-ghost" style="margin-top:8px" data-callretry>Thử lại</button></div>` : ""}
      </div></section>
    </div>
    <div class="dock"><div class="wrap">
      ${sugs.length ? `<div class="sugs" aria-label="Gợi ý trả lời">${sugs.map((s, i) => `<button class="sug" data-sug="${i}"><span class="zh">${esc(s.zh)}</span>${state.showPy ? `<small>${esc(s.pinyin || "")}</small>` : ""}<small class="muted">${esc(s.vi || "")}</small></button>`).join("")}</div>` : ""}
      ${answerBox("talk-in", "Gửi", "Nói hoặc gõ tiếng Trung / tiếng Việt...", c.busy)}
      ${c.msgs.some((m) => m.role === "me") ? "" : MIC_HINT}
    </div></div>`;
}

async function askAI() {
  const c = state.call;
  const hist = c.msgs.map((m) => (m.role === "ai" ? `${c.name}: ${m.reply}` : `Người học: ${m.text}`)).join("\n") || "(chưa có, bạn hãy chào và mở lời trước)";
  const prompt = `Bạn đang gọi điện trò chuyện bằng tiếng Trung với một người Việt đang học tiếng Trung, trình độ ${c.level}.
Vai của bạn: ${c.name}, ${c.style}.
${c.me ? `Người học đóng vai: ${c.me}.\n` : ""}${c.scene ? `Tình huống: ${c.scene}\n` : ""}${c.topic ? `Chủ đề: ${c.topic}\n` : ""}${c.script ? `Kịch bản mẫu để tham khảo (không bắt buộc theo):\n${c.script}\n` : ""}
Hội thoại đến giờ:
${hist}

Hãy viết lượt nói tiếp theo của ${c.name}:
- Nói như người thật đang gọi điện: tự nhiên, ấm áp, có cảm xúc, dùng 嗯、啊、哦、哈哈、真的吗 khi hợp.
- Chỉ dùng từ và ngữ pháp mức ${c.level}. 1-2 câu ngắn (tối đa khoảng 20 chữ Hán), sau đó hỏi lại hoặc gợi chuyện để người học nói tiếp.
- Nếu câu cuối của người học sai hoặc chưa tự nhiên: vẫn trả lời trong vai, nhận xét ngắn, thân thiện bằng tiếng Việt ở feedback_vi và đưa câu đúng vào corrected. Nếu câu đúng thì để hai trường này rỗng.
- Nếu người học viết tiếng Việt hoặc pinyin: hiểu ý, trả lời trong vai và đưa câu tiếng Trung tương ứng vào corrected.
- suggestions: 3 câu tiếng Trung khác nhau mà người học có thể dùng để đáp lại lượt nói của bạn, ngắn, mức ${c.level}.

Chỉ trả về một đối tượng JSON với đúng các khóa:
{"reply": "câu tiếng Trung giản thể", "reply_pinyin": "pinyin có dấu thanh", "reply_vi": "dịch tiếng Việt", "emotion": "một trong cheerful|friendly|calm|sad|surprised|sorry|hesitant|serious", "feedback_vi": "", "corrected": "", "corrected_pinyin": "", "suggestions": [{"zh": "", "pinyin": "", "vi": ""}]}`;
  c.busy = true; c.error = ""; render(); scrollBottom();
  try {
    const data = await sample.json(prompt, { modelTier: "quick", cache: false });
    if (!data || typeof data.reply !== "string") throw { code: "invalid_json" };
    if (state.call !== c) return;
    const lastUser = [...c.msgs].reverse().find((m) => m.role === "me");
    if (lastUser && !lastUser.fb) lastUser.fb = { feedback_vi: data.feedback_vi || "", corrected: data.corrected || "", corrected_pinyin: data.corrected_pinyin || "" };
    data.suggestions = Array.isArray(data.suggestions) ? data.suggestions.filter((s) => s && s.zh).slice(0, 3) : [];
    c.msgs.push({ role: "ai", ...data });
    c.busy = false;
    if (c.lessonId) { const p = prog(c.lessonId); p.talk = (p.talk || 0) + 1; saveProg(c.lessonId, p); }
    await sayAI(c.msgs.length - 1);
  } catch (e) {
    if (state.call !== c) return;
    c.busy = false; c.error = callErr(e); render();
  }
}
async function sayAI(i, slow = state.slow) {
  const c = state.call, m = c.msgs[i];
  c.speaking = i; render(); scrollBottom();
  const was = state.slow; state.slow = slow;
  await speak(m.reply, c.gender, m.emotion);
  state.slow = was;
  if (state.call === c && c.speaking === i) { c.speaking = null; render(); }
  if (state.view === "call") $("#talk-in")?.focus({ preventScroll: true });
}
function sendTalk(text) {
  const c = state.call;
  if (!c || c.busy) return;
  stopSpeaking(); c.speaking = null;
  c.msgs.push({ role: "me", text });
  askAI();
}

async function endCall() {
  const c = state.call;
  stopSpeaking();
  if (!c.msgs.some((m) => m.role === "me")) return leaveCall();
  c.ended = true; c.speaking = null; c.sumBusy = true; c.error = ""; render(); window.scrollTo(0, 0);
  const transcript = c.msgs.map((m) => (m.role === "ai" ? `${c.name}: ${m.reply}` : `Người học: ${m.text}`)).join("\n");
  const prompt = `Bạn là giáo viên tiếng Trung. Đây là cuộc gọi luyện nói của một người Việt đang học tiếng Trung (trình độ ${c.level}) với ${c.name}, chủ đề "${c.topic}".
${transcript}

Đánh giá phần nói của người học, ngắn gọn, thân thiện, bằng tiếng Việt. Chỉ trả về JSON:
{"score": số từ 0 đến 100 cho khả năng giao tiếp trong cuộc gọi, "overall_vi": "1-2 câu nhận xét chung, khích lệ", "good_vi": ["tối đa 3 điểm làm tốt"], "fixes": [{"wrong": "câu người học đã nói", "right": "câu đúng, tự nhiên", "right_pinyin": "pinyin có dấu", "why_vi": "giải thích ngắn"}], "words": [{"zh": "từ", "pinyin": "pinyin có dấu", "vi": "nghĩa"}]}
fixes: tối đa 4, chỉ những lỗi thật. words: 4-8 từ hữu ích trong cuộc gọi mà người học nên nhớ, ưu tiên từ HSK1-2.`;
  try {
    const s = await sample.json(prompt, { modelTier: "default", cache: false });
    if (state.call !== c) return;
    c.summary = s && typeof s === "object" ? s : { overall_vi: "" };
  } catch (e) {
    if (state.call !== c) return;
    c.error = callErr(e);
  }
  c.sumBusy = false; render();
}
function leaveCall() {
  const c = state.call;
  stopSpeaking(); state.call = null;
  if (c && c.lessonId) { openLesson(c.lessonId); state.tab = "talk"; render(); return; }
  state.view = "home"; state.home = "call"; render(); window.scrollTo(0, 0);
}

// Từ của tôi: các từ người học lưu lại để tập viết.
let myWords = store.get("mywords", []);
const canWrite = (zh) => hanChars(zh).length > 0 && hanChars(zh).every((c) => HZ_FILE[c]);
function saveWord(w) {
  if (myWords.some((x) => x.zh === w.zh)) return;
  myWords.push({ zh: w.zh, pinyin: w.pinyin || "", vi: w.vi || "" }); store.set("mywords", myWords);
}

function summaryView() {
  const c = state.call, s = c.summary;
  const head = `<header class="topbar"><div class="wrap">
      <button class="back" data-leavecall aria-label="Quay lại">${ICON.back}</button>
      <div class="topbar-title">Tổng kết cuộc gọi</div><span class="pill">${fmtTime((c.endAt ||= Date.now()) - c.start)}</span>
    </div></header>`;
  if (c.sumBusy) return head + `<div class="wrap"><div class="typing" style="margin-top:24px"><span class="dots"><i></i><i></i><i></i></span> Cô giáo AI đang xem lại cuộc gọi của bạn...</div></div>`;
  if (!s) return head + `<div class="wrap" style="padding-top:20px"><div class="callout">${esc(c.error || "Chưa tổng kết được.")}</div><div class="bar" style="margin-top:14px"><button class="btn btn-dark" data-leavecall>Xong</button></div></div>`;
  const score = Math.max(0, Math.min(100, Math.round(+s.score || 0)));
  const words = (Array.isArray(s.words) ? s.words : []).filter((w) => w && w.zh);
  return head + `<div class="wrap"><section class="panel" style="padding-top:18px">
    <div class="sumtop"><div class="score"><b class="c-${tone(score)}">${score}</b><span class="muted">/100</span></div><p style="margin:0">${esc(s.overall_vi || "")}</p></div>
    ${(s.good_vi || []).length ? `<div class="section-title">Bạn làm tốt</div><ul class="sumlist">${s.good_vi.map((g) => `<li>✓ ${esc(g)}</li>`).join("")}</ul>` : ""}
    ${(s.fixes || []).length ? `<div class="section-title">Nên sửa</div><div class="list" style="margin-top:0">${s.fixes.map((f) => `<div class="fix"><div class="zh c-bad" style="text-decoration:line-through">${esc(f.wrong || "")}</div><div class="zh c-good" style="font-size:19px">${esc(f.right || "")}</div>${f.right_pinyin ? `<div class="muted">${esc(f.right_pinyin)}</div>` : ""}<div style="font-size:14px;margin-top:4px">${esc(f.why_vi || "")}</div></div>`).join("")}</div>` : ""}
    ${words.length ? `<div class="section-title">Từ nên nhớ</div><div class="vocab">${words.map((w) => {
      const saved = myWords.some((x) => x.zh === w.zh), ok = canWrite(w.zh);
      return `<div><b>${esc(w.zh)}</b><span>${esc(w.pinyin || "")}</span><span class="muted">${esc(w.vi || "")}</span>${ok ? `<button class="chip" style="margin-left:auto" data-saveword="${esc(w.zh)}" ${saved ? "disabled" : ""}>${saved ? "Đã lưu" : "+ Tập viết"}</button>` : ""}</div>`;
    }).join("")}</div><p class="muted" style="font-size:13px;margin:-6px 0 0">Từ đã lưu nằm trong mục Tập viết chữ Hán, bộ "Từ của tôi".</p>` : ""}
    <div class="bar" style="margin-top:20px"><button class="btn btn-primary" data-recall>${ICON.phone}Gọi lại</button><button class="btn btn-ghost" data-leavecall>Xong</button></div>
  </section></div>`;
}

ě zài wǒmen gōngsī gōngzuò.","vi":"Hóa ra, cô ấy cũng làm ở công ty tôi."},{"zh":"从那天开始，我们每天一起吃午饭。","pinyin":"Cóng nà tiān kāishǐ, wǒmen měitiān yìqǐ chī wǔfàn.","vi":"Từ hôm đó, ngày nào chúng tôi cũng ăn trưa cùng nhau."},{"zh":"我觉得，下雨天也很不错。","pinyin":"Wǒ juéde, xià yǔ tiān yě hěn búcuò.","vi":"Tôi thấy, ngày mưa cũng hay đấy chứ."}],"words":[{"zh":"下雨","pinyin":"xià yǔ","vi":"trời mưa"},{"zh":"伞","pinyin":"sǎn","vi":"cái ô"},{"zh":"等","pinyin":"děng","vi":"đợi"},{"zh":"停","pinyin":"tíng","vi":"dừng, tạnh"},{"zh":"一边","pinyin":"yìbiān","vi":"vừa... (vừa...)"},{"zh":"聊天","pinyin":"liáotiān","vi":"trò chuyện"},{"zh":"原来","pinyin":"yuánlái","vi":"hóa ra"},{"zh":"开始","pinyin":"kāishǐ","vi":"bắt đầu"},{"zh":"不错","pinyin":"búcuò","vi":"khá hay, không tệ"}]},{"id":"beijing","type":"story","level":"HSK2","title":"第一次去北京","titlePy":"Dì-yī cì qù Běijīng","titleVi":"Lần đầu đến Bắc Kinh","intro":"Nhật ký du lịch Bắc Kinh mùa đông: Cố Cung, vịt quay và Vạn Lý Trường Thành.","g":"female","lines":[{"zh":"去年冬天，我第一次去北京旅游。","pinyin":"Qùnián dōngtiān, wǒ dì-yī cì qù Běijīng lǚyóu.","vi":"Mùa đông năm ngoái, lần đầu tiên tôi đi du lịch Bắc Kinh."},{"zh":"北京很冷，可是我非常高兴。","pinyin":"Běijīng hěn lěng, kěshì wǒ fēicháng gāoxìng.","vi":"Bắc Kinh rất lạnh, nhưng tôi vô cùng vui."},{"zh":"第一天，我去了天安门和故宫。","pinyin":"Dì-yī tiān, wǒ qùle Tiān'ānmén hé Gùgōng.","vi":"Ngày đầu tiên, tôi đến Thiên An Môn và Cố Cung."},{"zh":"故宫非常大，我走了一天，累极了。","pinyin":"Gùgōng fēicháng dà, wǒ zǒule yì tiān, lèi jí le.","vi":"Cố Cung rộng lắm, tôi đi bộ cả ngày, mệt rã rời."},{"zh":"晚上，我吃了北京烤鸭，真好吃！","pinyin":"Wǎnshang, wǒ chīle Běijīng kǎoyā, zhēn hǎochī!","vi":"Buổi tối, tôi ăn vịt quay Bắc Kinh, ngon thật!"},{"zh":"第二天，我坐车去了长城。","pinyin":"Dì-èr tiān, wǒ zuò chē qùle Chángchéng.","vi":"Ngày thứ hai, tôi đi xe đến Vạn Lý Trường Thành."},{"zh":"站在长城上，我看到了很美的雪。","pinyin":"Zhàn zài Chángchéng shang, wǒ kàndàole hěn měi de xuě.","vi":"Đứng trên Trường Thành, tôi được ngắm tuyết rất đẹp."},{"zh":"我希望明年还能再去北京。","pinyin":"W function openRead(id) {

  if (!r.mine) loadFile(`rd/${r.id}.json`).catch(() => {});
  render(); window.scrollTo(0, 0);
}
async function rdAudio(r, i, word) {
  const text = word || r.lines[i].zh, say = () => speak(text, word ? "female" : rdGender(r, r.lines[i]), "calm");
  if (r.mine) return say();
  stopSpeaking();
  const token = speakToken;
  try {
    const d = await loadFile(`rd/${r.id}.json`), b = word ? d.w[word] : d.l[i];
    if (token !== speakToken) return;
    if (!b) return say();
    return playSrc("data:audio/mpeg;base64," + b, say, state.slow && !word ? 0.8 : 1);
  } catch { return say(); }
}
function rdRefresh() {
  if (state.view !== "read" || state.rtab !== "read") return render();
  document.querySelectorAll(".rl.now").forEach((x) => x.classList.remove("now"));
  if (state.rplaying != null) document.getElementById("rl-" + state.rplaying)?.classList.add("now");
  const b = $("[data-rdall]"); if (b) b.innerHTML = state.rplayAll ? ICON.stop + "Dừng" : ICON.play + "Nghe cả bài";
}
async function rdPlayLine(i) {
  const r = R(), times = state.rtab === "read" && ytSync.win && timesOf(r);
  if (times) { ytCmd("seekTo", [Math.max(0, times[i] + ytOffset(r) - 0.2), true]); ytCmd("playVideo"); ytSync.cur = -2; return; }
  state.rplayAll = false; state.rplaying = i; rdRefresh();
  await rdAudio(r, i);
  if (state.rplaying === i && !state.rplayAll) { state.rplaying = null; rdRefresh(); }
}
async function rdPlayAll() {
  if (state.rplayAll) { stopSpeaking(); state.rplayAll = false; state.rplaying = null; return rdRefresh(); }
  const r = R(); state.rplayAll = true; ytCmd("pauseVideo");
  for (let i = 0; i < r.lines.length; i++) {
    if (!state.rplayAll || state.rd !== r) return;
    state.rplaying = i; rdRefresh();
    document.getElementById("rl-" + i)?.scrollIntoView({ behavior: "smooth", block: "center" });
    await rdAudio(r, i);
    if (!state.rplayAll) return;
    await sleep(r.type === "poem" || r.type === "song" ? 450 : 300);
  }
  state.rplayAll = false; state.rplaying = null;
  const p = rdProg(r.id); p.read = true; rdSave(r.id, p);
  rdRefresh();
}

// Chỉ có ở bản trên GitHub: AI của Google xem video YouTube và chép lời tiếng Trung.
async function transcribeYouTube(a, title, yt) {
  if (!window.gemini.key()) { a.error = "Hãy dán khóa AI của Google ở tab Gọi AI trước."; return render(); }
  a.busy = "yt"; render();
  try {
    const d = await window.gemini.video("https://www.youtube.com/watch?v=" + ytId(yt), `Hãy nghe phần tiếng Trung (tiếng nói hoặc lời hát) trong video này và chép lại bằng chữ Hán giản thể, để người Việt luyện đọc.
Tách thành các câu ngắn theo đúng thứ tự, tối đa 40 câu (nếu video dài, lấy 40 câu đầu). Bỏ qua phần không phải tiếng Trung.
Trả về JSON: {"title": "tên bài bằng chữ Hán", "title_pinyin": "", "title_vi": "", "type": "song|film|story|other", "level": "HSK1|HSK2|HSK3|HSK4+", "intro_vi": "1 câu giới thiệu", "lines": [{"t": số giây từ đầu video khi câu này BẮT ĐẦU, "zh": "", "pinyin": "pinyin có dấu", "vi": "dịch tiếng Việt tự nhiên"}], "words": [{"zh": "", "pinyin": "", "vi": ""}]}
"words": 6 đến 10 từ đáng học nhất. Nếu video không có tiếng Trung, trả về "lines": [].`);
    const lines = (d.lines || []).filter((x) => x && /[一-鿿]/.test(x.zh || "")).slice(0, 40).map((x) => ({ zh: x.zh.trim(), pinyin: x.pinyin || (window.pinyinPro ? pinyinPro.pinyin(x.zh) : ""), vi: x.vi || "" }));
    if (!lines.length) throw new Error("empty");
    const r = { yt, id: "u" + Date.now(), mine: true, type: RTYPE[d.type] ? d.type : a.type || "song", level: /^HSK/.test(d.level || "") ? d.level : "", title: title || d.title || lines[0].zh.slice(0, 12),
      titlePy: title ? "" : d.title_pinyin || "", titleVi: d.title_vi || "", intro: d.intro_vi || "", g: "female", lines, words: (d.words || []).filter((w) => w && w.zh).slice(0, 12) };
    if (!r.titlePy && window.pinyinPro) r.titlePy = pinyinPro.pinyin(r.title);
    const raw = (d.lines || []).filter((x) => x && /[一-鿿]/.test(x.zh || "")).slice(0, 40);
    if (raw.every((x) => x.t != null)) setTimes(r, raw.map((x) => x.t));
    myReads.push(r); store.set("myreads", myReads);
    state.add = { type: a.type }; state.rtype = "other";
    openRead(r.id);
  } catch (e) {
    a.busy = false;
    a.error = e.message === "empty" ? "AI không chép được lời từ video này (có thể video không có tiếng Trung, hoặc Google không cho chép lời bài hát có bản quyền). Bạn có thể dán lời vào ô bên dưới." : "Chưa chép được lời: " + e.message;
    render();
  }
}
function splitLines(text) {
  const out = [];
  for (let raw of text.replace(/\r/g, "").split("\n")) {
    raw = raw.replace(/^\s*\d+\s*$/, "").replace(/\d\d:\d\d(:\d\d)?([.,]\d+)?(\s*-->\s*\d\d:\d\d(:\d\d)?([.,]\d+)?)?/g, "").trim();
    if (!/[一-鿿]/.test(raw)) continue;
    // Câu quá dài thì tách theo dấu kết câu.
    const parts = raw.length > 40 ? raw.match(/[^。！？!?]+[。！？!?”"]*/g) || [raw] : [raw];
    for (const p of parts) if (p.trim()) out.push(p.trim());
  }
  return out.slice(0, 40);
}

Tên bài: ${title || "(không có)"}
Các dòng (đánh số):
${zh.map((x, i) => `${i + 1}. ${x}`).join("\n")}

"lines" phải có đúng ${zh.length} phần tử theo đúng thứ tự các dòng. "words": 6 đến 10 từ đáng học nhất trong bài.`, { modelTier: "default", cache: false });
      (d.lines || []).forEach((x, i) => { if (r.lines[i]) { r.lines[i].pinyin = x.pinyin || r.lines[i].pinyin; r.lines[i].vi = x.vi || ""; } });
      Object.assign(r, { titlePy: d.title_pinyin || "", titleVi: d.title_vi || "", intro: d.intro_vi || "", level: /^HSK/.test(d.level || "") ? d.level : "", words: (d.words || []).filter((w) => w && w.zh).slice(0, 12) });
    } catch (e) {

    }
  }
  if (!r.titlePy && window.pinyinPro) r.titlePy = pinyinPro.pinyin(r.title);

  if ("follow" in d) { state.follow = !state.follow; store.set("follow", state.follow); t.setAttribute("aria-pressed", state.follow); return; }
  if (d.ytoff) { const o = store.get("ytoff", {}); o[R().id] = +((+(o[R().id] || 0)) + +d.ytoff).toFixed(1); store.set("ytoff", o); ytSync.cur = -2; ytHighlight(); return; }
  if ("ytedit" in d) { state.ytEdit = true; return render(); }
  if ("ytcancel" in d) { state.ytEdit = false; return render(); }
  if (d.rtab) { stopSpeaking(); state.rplayAll = false; state.rplaying = null; state.rtab = d.rtab; state.rres = null; return render(); }
  if (d.rplay != null) return rdPlayLine(+d.rplay);
  if ("rdall" in d) return rdPlayAll();
  if (d.rgo != null) { stopSpeaking(); state.rline = Math.max(0, Math.min(R().lines.length - 1, +d.rgo)); state.rres = null; state.rplaying = null; return render(); }
  if (d.rword) return rdAudio(R(), 0, d.rword);
  if (d.rsave) { const w = R().words.find((x) => x.zh === d.rsave); if (w) saveWord(w); return render(); }
  if ("rddel" in d) { if (!confirm("Xóa bài đọc này?")) return; myReads = myReads.filter((x) => x.id !== R().id); store.set("myreads", myReads); return goHome(); }
  if (d.level) { state.level = d.level; store.set("level", state.level); return render(); }
  if (d.writedeck) return openWrite(d.writedeck);
  if ("review" in d) return openReview();
  if (d.word) return playWord(d.word);
  if ("ex" in d) return playExample(curWord());
  if (d.wi != null) return goWord(+d.wi);
  if (d.ci != null) { Object.assign(state.w, { ci: +d.ci, mode: state.w.review ? "recall" : "watch", result: null }); return render(); }
  if (d.wmode) { Object.assign(state.w, { mode: d.wmode, result: null }); return render(); }
  if ("wretry" in d) { state.w.result = null; return render(); }
  if ("wnext" in d) return writeNext();
  if ("wreveal" in d) { const c = curChars()[state.w.ci]; grade(c, 9); state.w.result = { m: 9, reveal: true }; return render(); }
  if (d.tab) return setTab(d.tab);
  if (d.toggle) {
    state[d.toggle] = !state[d.toggle];
    if (d.toggle !== "vocab") store.set(d.toggle, state[d.toggle]);
    if (state.view === "call") { stopSpeaking(); state.call.speaking = null; }
    if (state.view === "read" && state.rtab === "read" && (d.toggle === "showPy" || d.toggle === "showVi")) {
      t.setAttribute("aria-pressed", state[d.toggle]); $(".rd-text")?.classList.toggle(d.toggle === "showPy" ? "no-py" : "no-vi", !state[d.toggle]); return;
    }
    return render();
  }
  if (d.say != null) {
    return playLine(+d.say);
  }
  if (d.voiceset != null) {
    state.roleRun = (state.roleRun || 0) + 1; state.playAll = false; state.playing = null;
    state.voiceSet = +d.voiceset; store.set("voiceSet", state.voiceSet); render();
    const i = L().lines.findIndex((x) => x.speaker === "A");
    return playLineAudio(L(), i < 0 ? 0 : i);
  }
  if ("playall" in d) return playAll();
  if ("drillplay" in d) {
    const ln = L().lines[state.drill];
    state.playing = "drill"; render();
    return playLineAudio(L(), state.drill).then(() => { if (state.playing === "drill") { state.playing = null; render(); } });
  }
  if (d.drillgo != null) { stopSpeaking(); state.drill = Math.max(0, Math.min(L().lines.length - 1, +d.drillgo)); state.drillResult = null; state.playing = null; return render(); }
  if (d.pickrole != null) {
    stopSpeaking(); state.roleRun = (state.roleRun || 0) + 1;
    state.role = d.pickrole || null; state.results = {}; state.shown = 0; state.speaking = null;
    if (state.role) { render(); runRole(0); } else render();
    return;
  }
  if ("hide" in d) { state.hide = !state.hide; return render(); }
  if ("continue" in d) return runRole(state.shown);
  if ("retry" in d) { delete state.results[state.shown - 1]; render(); return; }
  if (d.talkrole) return startLessonCall(d.talkrole);
  if ("keyedit" in d) { state.keyEdit = true; return render(); }
  if ("voiceedit" in d) { state.voiceEdit = true; return render(); }
  if (d.persona) { state.cs.pid = d.persona; state.cs.topic = ""; return render(); }
  if (d.topic) { state.cs.topic = d.topic; const t = $("#topic-in"); if (t) t.value = ""; return render(); }
  if (d.clevel) { state.cs.level = d.clevel; return render(); }
  if ("startcall" in d) return startCallFromHome();
  if ("endcall" in d) return endCall();
  if ("leavecall" in d) return leaveCall();
  if ("recall" in d) { const c = state.call; return startCall({ name: c.name, py: c.py, vi: c.vi, gender: c.gender, style: c.style, me: c.me, scene: c.scene, script: c.script, topic: c.topic, level: c.level, lessonId: c.lessonId }); }
  if ("callretry" in d) return askAI();
  if (d.sug != null) { const last = state.call.msgs[state.call.msgs.length - 1]; return sendTalk(last.suggestions[+d.sug].zh); }
  if (d.peek != null) { state.call.peek[d.peek] = true; return render(); }
  if (d.replay != null) { const c = state.call; stopSpeaking(); c.speaking = null; return sayAI(+d.replay, !!d.slow); }
  if (d.saveword) { const w = (state.call.summary.words || []).find((x) => x.zh === d.saveword); if (w) saveWord(w); return render(); }
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.matches("[data-voiceform]")) {
    let u = ($("#voice-url")?.value || "").trim();
    if (u && !/^https?:\/\//.test(u)) u = "https://" + u;
    store.set("voiceUrl", u); state.voiceEdit = false; return render();
  }
  if (e.target.matches("[data-keyform]")) {
    const k = ($("#key-in")?.value || "").trim(); if (!k) return;
    window.gemini.setKey(k); location.reload(); return;
  }
  if (e.target.matches("[data-ytform]")) {
    const u = ($("#yt-in")?.value || "").trim();
    if (u && !mediaOf(u)) { alert("Link chưa đúng. Hãy dán cả đường link bắt đầu bằng https://"); return; }
    if (u !== ytOf(R())) { delete ytTimes[R().id]; store.set("ytt", ytTimes); }
    if (u) ytLinks[R().id] = u; else delete ytLinks[R().id];
    store.set("yt", ytLinks); state.ytEdit = false; return render();
  }
  if (e.target.matches("[data-addform]")) { if (!state.add?.busy) createRead(); return; }
  const form = e.target, input = form.querySelector("input"), text = input.value.trim();
  if (!text) { input.focus(); return; }
  const kind = form.dataset.answer;
  if (kind === "drill-in") {
    const ln = L().lines[state.drill];
    const r = { ...scoreAnswer(ln.zh, text), text };
    state.drillResult = r; recordBest(state.drill, r.score); render();
  } else if (kind === "role-in") {
    const idx = state.shown - 1, ln = L().lines[idx];
    const r = { ...scoreAnswer(ln.zh, text), text };
    state.results[idx] = r; recordBest(idx, r.score); render(); scrollBottom();
  } else if (kind === "rd-in") {
    const r = R(), ln = r.lines[state.rline];
    state.rres = { ...scoreAnswer(ln.zh, text), text };
    const p = rdProg(r.id); p.best = p.best || {}; p.best[state.rline] = Math.max(p.best[state.rline] || 0, state.rres.score); rdSave(r.id, p);
    render();
  } else if (kind === "talk-in") {
    if (!state.call || state.call.busy) return;
    sendTalk(text);
  }
});
document.addEventListener("change", (e) => {
  const s = e.target.closest("select[data-voice]");
  if (!s) return;
  store.set("voice-" + s.dataset.voice, s.value);
  const ln = L().lines.find((x) => ch(x.speaker).gender === s.dataset.voice);
  if (ln) speak(ln.zh, s.dataset.voice, ln.emotion);
});

const fromHash = location.hash.slice(1);
if (fromHash && LESSONS.some((l) => l.id === fromHash)) openLesson(fromHash); else render();
</script>
